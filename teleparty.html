<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Mazis Cast Room V6.7</title>
<style>
body { margin: 0; background: #111; color: #fff; font-family: Arial; display: flex; flex-direction: column; height: 100vh; }
#topbar { background: #222; padding: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#topbar input { padding: 5px; background: #333; color: #fff; border: 1px solid #555; }
#topbar button { padding: 5px 10px; background: #0f0; color: #000; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
#topbar button.tool { background: #555; color: #fff; }
#topbar button.tool.active { background: orange; }
#videoGrid { display: flex; flex-wrap: wrap; gap: 5px; padding: 5px; background: #1a1a1a; border-bottom: 2px solid #0f0; max-height: 25vh; }
.video-box { width: 160px; height: 120px; background: #000; border: 2px solid #333; border-radius: 5px; position: relative; }
.video-box video { width: 100%; height: 100%; object-fit: cover; }
#main { flex: 1; display: flex; overflow: hidden; }
#viewerArea { flex: 1; background: #000; position: relative; overflow: auto; display: flex; align-items: center; justify-content: center; }
#canvas { width: 100%; height: 100%; object-fit: contain; background: #000; }
#imageView { max-width: 100%; max-height: 100%; display: none; }
#audioView { width: 90%; display: none; }
#docContainer { width: 100%; height: 100%; overflow: auto; display: none; position: relative; }
#pdfView, #txtView { width: 100%; height: 100%; }
#txtView { padding: 20px; background: #222; color: #eee; white-space: pre-wrap; font-size: 16px; line-height: 1.8; }
#pdfView canvas { display: block; margin: 10px auto; box-shadow: 0 0 10px #000; }
#annotationCanvas { position: absolute; top: 0; left: 0; pointer-events: none; } /* القماش بتاع الشخبطة */
#docContainer.annotation #annotationCanvas { pointer-events: auto; } /* افتح الشخبطة وقت القلم */
.highlight { background-color: yellow; }
#chat { width: 280px; background: #1a1a1a; display: flex; flex-direction: column; border-right: 2px solid #0f0; }
#messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 14px; }
.msg { margin: 5px 0; padding: 6px; background: #333; border-radius: 5px; }
#chatInput { display: flex; padding: 10px; gap: 5px; }
#chatInput input { flex: 1; padding: 8px; background: #333; color: #fff; border: 1px solid #555; }
#controls { background: #222; padding: 10px; display: flex; gap: 10px; justify-content: center; }
#controls button { padding: 10px 20px; background: #0f0; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
.flying-emoji { position: absolute; font-size: 32px; animation: flyUp 3s linear forwards; pointer-events: none; }
@keyframes flyUp { 0% { bottom: 0; opacity: 1; } 100% { bottom: 100%; opacity: 0; } }
</style>
</head>
<body>

<div id="topbar">
    <label>📁 رفع: <input type="file" id="upload" accept="video/*,audio/*,image/*,.pdf,.txt"></label>
    <input type="text" id="myId" placeholder="اسمك" value="host">
    <input type="text" id="friendId" placeholder="اسم صاحبك">
    <button id="create">انشاء</button>
    <button id="join">دخول</button>
    <button id="voiceBtn">🎤</button>
    <button id="videoBtn" class="blue">📹</button>
    <button id="toolHighlight" class="tool">🖍️ تظليل</button>
    <button id="toolDraw" class="tool">✏️ قلم</button>
    <button id="toolSelect" class="tool active">👆 تحديد</button>
    <span id="status" style="color:#ff0">اكتب اسمك</span>
</div>

<div id="videoGrid"></div>

<div id="main">
    <div id="viewerArea">
        <video id="canvas" controls></video>
        <img id="imageView">
        <audio id="audioView" controls></audio>
        <div id="docContainer">
            <div id="pdfView"></div>
            <div id="txtView"></div>
            <canvas id="annotationCanvas"></canvas>
        </div>
    </div>
    <div id="chat">
        <div id="messages"></div>
        <div id="chatInput">
            <input type="text" id="msgText" placeholder="اكتب...">
            <button id="sendMsg">ارسال</button>
        </div>
    </div>
</div>

<div id="controls">
    <button id="play">▶️</button>
    <button id="pause">⏸️</button>
    <button id="prevPage" style="display:none;">⬅️</button>
    <button id="nextPage" style="display:none;">➡️</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let video = document.getElementById('canvas');
let imageView = document.getElementById('imageView');
let audioView = document.getElementById('audioView');
let docContainer = document.getElementById('docContainer');
let pdfView = document.getElementById('pdfView');
let txtView = document.getElementById('txtView');
let annCanvas = document.getElementById('annotationCanvas');
let annCtx = annCanvas.getContext('2d');
let viewerArea = document.getElementById('viewerArea');

let peer, conn, call;
let myName = "انا";
let isSyncing = false;
let isHost = false;
let mediaChunks = [];
let mediaType = "";
let pdfDoc = null;
let currentPage = 1;
let currentBlobUrl = null;
let tool = 'select'; // select, highlight, draw
let isDrawing = false;
let annotations = []; // بنخزن كل الشخبطات هنا

// ادوات الرسم
document.getElementById('toolHighlight').onclick = ()=> setTool('highlight');
document.getElementById('toolDraw').onclick = ()=> setTool('draw');
document.getElementById('toolSelect').onclick = ()=> setTool('select');
function setTool(t){
    tool = t;
    document.querySelectorAll('.tool').forEach(b=>b.classList.remove('active'));
    document.getElementById('tool'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');
    docContainer.className = t=='select'? '' : 'annotation';
}

// الكاميرا والصوت
document.getElementById('voiceBtn').onclick = async function(){
    if(!localStream){ localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    if(conn) call = peer.call(conn.peer, localStream);
}
document.getElementById('videoBtn').onclick = async function(){
    if(!localVideoStream){ localVideoStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true }); }
    addVideoBox(myName, localVideoStream, true);
    if(conn) call = peer.call(conn.peer, localVideoStream);
}
function addVideoBox(id, stream, isMe){
    let box = document.createElement('div'); box.id = 'vid-' + id; box.className = 'video-box';
    let v = document.createElement('video'); v.srcObject = stream; v.autoplay = true; v.muted = isMe; box.appendChild(v);
    document.getElementById('videoGrid').appendChild(box);
}

// رفع الملفات
document.getElementById('upload').onchange = function(e){
    let file = e.target.files[0]; if(!file ||!conn) return;
    addMsg("النظام", "جاري رفع: " + file.name);
    hideAllMedia();
    if(file.type.startsWith('video/')){ mediaType = 'video'; video.style.display = 'block'; }
    else if(file.type.startsWith('audio/')){ mediaType = 'audio'; audioView.style.display = 'block'; }
    else if(file.type.startsWith('image/')){ mediaType = 'image'; imageView.style.display = 'block'; }
    else { mediaType = file.type=='application/pdf'? 'pdf' : 'txt'; docContainer.style.display = 'block'; }

    let reader = new FileReader();
    reader.onload = function(evt){
        let base64 = evt.target.result;
        if(mediaType == 'video'){ video.src = base64; }
        if(mediaType == 'audio'){ audioView.src = base64; }
        if(mediaType == 'image'){ imageView.src = base64; }
        if(mediaType == 'txt'){ txtView.innerText = atob(base64.split(',')[1]); setupTxtScroll(); }
        if(mediaType == 'pdf'){
            let pdfData = atob(base64.split(',')[1]);
            pdfjsLib.getDocument({data: pdfData}).promise.then(pdf=>{ pdfDoc = pdf; currentPage = 1; renderPdfPage(1); document.getElementById('prevPage').style.display='inline'; document.getElementById('nextPage').style.display='inline'; setupPdfScroll(); });
        }
        send({type: 'mediaStart', typeFile: mediaType, name: file.name});
        sendInChunks(base64);
    }
    reader.readAsDataURL(file);
}

function sendInChunks(base64){
    const chunkSize = 16000;
    for(let i = 0; i < base64.length; i += chunkSize){ send({type: 'mediaChunk', data: base64.slice(i, i + chunkSize)}); }
    send({type: 'mediaEnd'});
}

// تصليح اللابتوب: استخدم Blob و استنى يتحمل
function loadMediaFromBase64(base64){
    if(currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
    let byteCharacters = atob(base64.split(',')[1]);
    let byteArray = new Uint8Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) { byteArray[i] = byteCharacters.charCodeAt(i); }
    let blob = new Blob([byteArray], {type: mediaType == 'video'? 'video/mp4' : 'audio/mp3'});
    currentBlobUrl = URL.createObjectURL(blob);
    if(mediaType == 'video'){
        video.src = currentBlobUrl;
        video.onloadeddata = ()=>{ URL.revokeObjectURL(currentBlobUrl); } // امسحو بعد يتحمل بس
    }
    if(mediaType == 'audio'){ audioView.src = currentBlobUrl; }
}

function hideAllMedia(){
    if(currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
    video.style.display = 'none'; imageView.style.display = 'none';
    audioView.style.display = 'none'; docContainer.style.display = 'none';
    document.getElementById('prevPage').style.display = 'none'; document.getElementById('nextPage').style.display = 'none';
    annotations = []; redrawAnnotations();
}

function renderPdfPage(p){
    pdfDoc.getPage(p).then(page=>{
        let v = page.getViewport({scale: 1.5});
        annCanvas.width = v.width; annCanvas.height = v.height; // ظبط مقاس القماش
        let c = document.createElement('canvas'); c.height = v.height; c.width = v.width;
        pdfView.innerHTML = ""; pdfView.appendChild(c);
        page.render({canvasContext: c.getContext('2d'), viewport: v}).promise.then(redrawAnnotations);
    });
}
document.getElementById('nextPage').onclick = ()=>{ if(pdfDoc && currentPage < pdfDoc.numPages){ currentPage++; renderPdfPage(currentPage); send({type: 'docPage', page: currentPage}); } }
document.getElementById('prevPage').onclick = ()=>{ if(pdfDoc && currentPage > 1){ currentPage--; renderPdfPage(currentPage); send({type: 'docPage', page: currentPage}); } }

// === مزامنة السكرول ===
function setupTxtScroll(){ docContainer.onscroll = ()=>{ if(!isSyncing) send({type:'docScroll', scroll: docContainer.scrollTop}); } }
function setupPdfScroll(){ docContainer.onscroll = ()=>{ if(!isSyncing) send({type:'docScroll', scroll: docContainer.scrollTop}); } }

// === مزامنة الشخبطة والتظليل ===
annCanvas.onmousedown = (e)=>{ if(tool=='draw'){ isDrawing=true; annotations.push({type:'draw', points:[], color:'red', page:currentPage}); } }
annCanvas.onmousemove = (e)=>{
    if(isDrawing){
        let rect = annCanvas.getBoundingClientRect();
        let x = e.clientX - rect.left; let y = e.clientY - rect.top;
        annotations[annotations.length-1].points.push({x,y});
        redrawAnnotations();
    }
}
annCanvas.onmouseup = ()=>{ if(isDrawing){ isDrawing=false; send({type:'annotation', data:annotations[annotations.length-1]}); } }

function redrawAnnotations(){
    annCtx.clearRect(0,0,annCanvas.width,annCanvas.height);
    annotations.filter(a=>a.page==currentPage).forEach(a=>{
        if(a.type=='draw'){
            annCtx.strokeStyle = a.color; annCtx.lineWidth = 3;
            annCtx.beginPath(); a.points.forEach((p,i)=>{ i==0? annCtx.moveTo(p.x,p.y) : annCtx.lineTo(p.x,p.y); }); annCtx.stroke();
        }
        if(a.type=='highlight'){
            annCtx.fillStyle = 'rgba(255,255,0,0.4)'; annCtx.fillRect(a.x, a.y, a.w, a.h);
        }
    });
}

// الشات
function addMsg(name, text){ let div = document.createElement('div'); div.className = 'msg'; div.innerHTML = "<b>" + name + ":</b> " + text; document.getElementById('messages').appendChild(div); }
document.getElementById('sendMsg').onclick = function(){ let text = document.getElementById('msgText').value; if(text && conn){ addMsg(myName, text); send({type: 'chat', name: myName, text: text}); document.getElementById('msgText').value = ''; } }

// الاتصال
document.getElementById('create').onclick = function(){ myName = document.getElementById('myId').value; peer = new Peer(myName); peer.on('open', id=>{ document.getElementById('status').innerText = "الغرفة: " + id; }); peer.on('connection', c=>{ conn = c; isHost = true; setupConn(); }); peer.on('call', c=>{ c.answer(localVideoStream || localStream); }); }
document.getElementById('join').onclick = function(){ myName = document.getElementById('myId').value; let friend = document.getElementById('friendId').value; peer = new Peer(myName + "-guest"); peer.on('open', ()=>{ conn = peer.connect(friend); setupConn(); }); peer.on('call', c=>{ c.answer(localVideoStream || localStream); }); }

function setupConn(){
    conn.on('open', ()=>{ document.getElementById('status').innerText = "متصل"; });
    conn.on('data', data=>{
        isSyncing = true;
        if(data.type == 'mediaStart'){ mediaChunks = []; mediaType = data.typeFile; hideAllMedia(); if(mediaType=='video') video.style.display='block'; if(mediaType=='audio') audioView.style.display='block'; if(mediaType=='image') imageView.style.display='block'; if(mediaType=='pdf'||mediaType=='txt') docContainer.style.display='block'; }
        if(data.type == 'mediaChunk'){ mediaChunks.push(data.data); }
        if(data.type == 'mediaEnd'){
            let base64 = mediaChunks.join('');
            if(mediaType == 'video' || mediaType == 'audio'){ loadMediaFromBase64(base64); }
            if(mediaType == 'image') imageView.src = base64;
            if(mediaType == 'txt'){ txtView.innerText = atob(base64.split(',')[1]); setupTxtScroll(); }
            if(mediaType == 'pdf'){
                let pdfData = atob(base64.split(',')[1]);
                pdfjsLib.getDocument({data: pdfData}).promise.then(pdf=>{ pdfDoc = pdf; currentPage = 1; renderPdfPage(1); document.getElementById('prevPage').style.display='inline'; document.getElementById('nextPage').style.display='inline'; setupPdfScroll(); });
            }
        }
        if(data.type == 'docScroll'){ docContainer.scrollTop = data.scroll; }
        if(data.type == 'docPage'){ currentPage=data.page; if(mediaType=='pdf') renderPdfPage(currentPage); }
        if(data.type == 'annotation'){ annotations.push(data.data); redrawAnnotations(); }
        if(data.type == 'chat'){ addMsg(data.name, data.text); }
        if(data.type == 'play'){ (mediaType=='video'?video:audioView).currentTime = data.time; (mediaType=='video'?video:audioView).play(); }
        if(data.type == 'pause'){ (mediaType=='video'?video:audioView).currentTime = data.time; (mediaType=='video'?video:audioView).pause(); }
        if(data.type == 'seek'){ (mediaType=='video'?video:audioView).currentTime = data.time; }
        setTimeout(()=>{ isSyncing = false; }, 100);
    });
}
function send(data){ if(conn &&!isSyncing) conn.send(data); }

video.onplay = ()=>{ if(isHost) send({type: 'play', time: video.currentTime}); }
video.onpause = ()=>{ if(isHost) send({type: 'pause', time: video.currentTime}); }
video.onseeked = ()=>{ if(isHost) send({type: 'seek', time: video.currentTime}); }
document.getElementById('play').onclick = ()=>{ (mediaType=='video'?video:audioView).play(); }
document.getElementById('pause').onclick = ()=>{ (mediaType=='video'?video:audioView).pause(); }

</script>
</body>
</html>
