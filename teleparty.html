<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teleparty Video Only</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial;display:flex;flex-direction:column;height:100vh}
#topbar{background:#222;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:50}
#topbar label{background:#00aaff;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:bold;color:#fff}
#topbar input{display:none}
#topbar input[type=text]{display:block;padding:7px;background:#333;color:#fff;border:1px solid #555;border-radius:4px;width:120px}
#topbar button{padding:7px 14px;background:#0f0;border:none;border-radius:5px;font-weight:bold;cursor:pointer}
#main{flex:1;display:flex;overflow:hidden}
#viewerArea{flex:1;background:#000;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#videoPlayer{width:100%;height:100%;object-fit:contain;display:none;background:#000}
#audioPlayer{width:90%;display:none}
#placeholder{color:#777;text-align:center;font-size:18px;line-height:1.6}
#chat{width:330px;background:#1a1a1a;display:flex;flex-direction:column;border-right:2px solid #0f0}
#messages{flex:1;overflow-y:auto;padding:12px}
.msg{margin:8px 0;padding:10px 12px;background:#2a2a2a;border-radius:8px;font-size:16px;line-height:1.5;word-break:break-word}
.msg.sys{background:#3a3a1a;color:#ffeb3b;font-size:14px;border:1px solid #555}
.msg b{color:#0f0;font-size:15px}
#chatInput{display:flex;padding:12px;gap:8px;border-top:1px solid #333}
#chatInput input{flex:1;display:block;padding:12px;background:#333;color:#fff;border:1px solid #555;border-radius:6px;font-size:16px}
#chatInput button{padding:12px 16px;background:#0f0;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:16px}
#controls{background:#222;padding:12px;display:flex;gap:12px;justify-content:center}
#controls button{padding:10px 20px;background:#0f0;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:15px}
@media(max-width:700px){#main{flex-direction:column} #viewerArea{height:50vh} #chat{width:100%;height:50vh;border-right:none;border-top:2px solid #0f0}}
</style>
</head>
<body>

<div id="topbar">
  <b style="color:#0f0">Teleparty</b>
  <label for="fileInput">📁 رفع فيديو / صوت</label>
  <input type="file" id="fileInput" accept="video/*,audio/*">
  <input type="text" id="myId" placeholder="اسمك" value="host">
  <input type="text" id="friendId" placeholder="اسم الغرفة">
  <button id="btnCreate">انشاء</button>
  <button id="btnJoin">دخول</button>
  <span id="status" style="color:#ff0;font-size:13px">جاهز</span>
</div>

<div id="main">
  <div id="viewerArea">
    <div id="placeholder">ارفع فيديو او صوت<br><small>mp4 - webm - mp3 - wav</small></div>
    <video id="videoPlayer" controls playsinline preload="auto"></video>
    <audio id="audioPlayer" controls preload="auto"></audio>
  </div>
  <div id="chat">
    <div id="messages"></div>
    <div id="chatInput">
      <input id="txtMsg" placeholder="اكتب رسالتك هنا...">
      <button id="btnSend">ارسال</button>
    </div>
  </div>
</div>

<div id="controls">
  <button id="btnPlay">تشغيل ▶</button>
  <button id="btnPause">ايقاف ⏸</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
const videoEl = document.getElementById('videoPlayer');
const audioEl = document.getElementById('audioPlayer');
const placeholder = document.getElementById('placeholder');
const messagesDiv = document.getElementById('messages');
const fileInput = document.getElementById('fileInput');

let peer = null;
let conn = null;
let isHost = false;
let localURL = null;
let mediaType = '';
let mediaChunks = [];

function addSys(t){
  const d=document.createElement('div');
  d.className='msg sys';
  d.textContent='النظام: '+t;
  messagesDiv.appendChild(d);
  messagesDiv.scrollTop=messagesDiv.scrollHeight;
}
function addChat(name, text){
  const d=document.createElement('div');
  d.className='msg';
  d.innerHTML='<b>'+name+':</b> '+text;
  messagesDiv.appendChild(d);
  messagesDiv.scrollTop=messagesDiv.scrollHeight;
}

addSys('جاهز - ارفع فيديو');

fileInput.onchange = function(){
  const file = fileInput.files[0];
  if(!file){ addSys('لم تختر ملف'); return; }

  addSys('اخترت: '+file.name);

  videoEl.pause();
  audioEl.pause();
  videoEl.style.display='none';
  audioEl.style.display='none';
  placeholder.style.display='none';

  if(localURL){ try{ URL.revokeObjectURL(localURL); }catch(e){} }

  const isVideo = file.type.indexOf('video')===0 || file.name.match(/mp4|webm|mov/i);
  mediaType = isVideo? 'video' : 'audio';

  try{
    localURL = URL.createObjectURL(file);
    if(mediaType==='video'){
      videoEl.src = localURL;
      videoEl.style.display='block';
      videoEl.load();
      videoEl.onloadeddata = function(){ addSys('فيديو جاهز - دوس تشغيل'); };
      videoEl.onerror = function(){
        addSys('Blob فشل - بجرب DataURL');
        const r2=new FileReader();
        r2.onload=function(ev){ videoEl.src=ev.target.result; videoEl.style.display='block'; videoEl.load(); };
        r2.readAsDataURL(file);
      };
    }else{
      audioEl.src = localURL;
      audioEl.style.display='block';
      audioEl.load();
      addSys('صوت جاهز: '+file.name);
    }
  }catch(err){
    addSys('خطأ: '+err.message);
  }

  if(conn && conn.open){
    addSys('سيتم الارسال');
    setTimeout(function(){
      const reader = new FileReader();
      reader.onload = function(ev){
        const b64 = ev.target.result;
        conn.send({type:'mediaStart', fileType:mediaType, name:file.name});
        for(let i=0;i<b64.length;i+=16000){
          conn.send({type:'mediaChunk', data:b64.slice(i,i+16000)});
        }
        conn.send({type:'mediaEnd'});
        addSys('تم الارسال');
      };
      reader.readAsDataURL(file);
    },1000);
  }

  fileInput.value='';
};

document.getElementById('btnPlay').onclick = function(){
  if(mediaType==='video') videoEl.play();
  if(mediaType==='audio') audioEl.play();
};
document.getElementById('btnPause').onclick = function(){
  if(mediaType==='video') videoEl.pause();
  if(mediaType==='audio') audioEl.pause();
};
document.getElementById('btnSend').onclick = function(){
  const txt=document.getElementById('txtMsg').value.trim();
  if(!txt) return;
  const name=document.getElementById('myId').value||'انا';
  addChat(name, txt);
  if(conn && conn.open) conn.send({type:'chat', name:name, text:txt});
  document.getElementById('txtMsg').value='';
};
document.getElementById('txtMsg').onkeypress = function(e){ if(e.key==='Enter') document.getElementById('btnSend').click(); };

document.getElementById('btnCreate').onclick = function(){
  const id=document.getElementById('myId').value||'host';
  peer=new Peer(id);
  peer.on('open', function(mid){
    document.getElementById('status').textContent='غرفة: '+mid;
    addSys('غرفة: '+mid);
  });
  peer.on('connection', function(c){ conn=c; isHost=true; setupConn(); });
};

document.getElementById('btnJoin').onclick = function(){
  const myId=document.getElementById('myId').value||'guest';
  const friendId=document.getElementById('friendId').value.trim();
  if(!friendId){ addSys('اكتب اسم الغرفة'); return; }
  peer=new Peer(myId+'-'+Date.now());
  peer.on('open', function(){ conn=peer.connect(friendId); setupConn(); addSys('بدخل: '+friendId); });
};

function setupConn(){
  conn.on('open', function(){
    document.getElementById('status').textContent='متصل: '+conn.peer;
    addSys('متصل مع '+conn.peer);
  });
  conn.on('data', function(data){
    if(data.type==='mediaStart'){
      mediaChunks=[];
      mediaType=data.fileType;
      videoEl.pause(); audioEl.pause();
      videoEl.style.display='none'; audioEl.style.display='none';
      placeholder.style.display='none';
      addSys('استلام: '+data.name);
    }
    if(data.type==='mediaChunk'){ mediaChunks.push(data.data); }
    if(data.type==='mediaEnd'){
      const full=mediaChunks.join('');
      if(mediaType==='video'){ videoEl.src=full; videoEl.style.display='block'; videoEl.load(); addSys('اكتمل - دوس تشغيل'); }
      if(mediaType==='audio'){ audioEl.src=full; audioEl.style.display='block'; addSys('اكتمل'); }
    }
    if(data.type==='chat'){ addChat(data.name, data.text); }
  });
  conn.on('close', function(){ addSys('انقطع الاتصال'); });
}
</script>
</body>
</html>
