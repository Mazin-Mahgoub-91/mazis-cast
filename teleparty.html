<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Mazis Cast Room V6.5</title>
<style>
body { margin: 0; background: #111; color: #fff; font-family: Arial; display: flex; flex-direction: column; height: 100vh; }
#topbar { background: #222; padding: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#topbar input { padding: 5px; background: #333; color: #fff; border: 1px solid #555; }
#topbar button { padding: 5px 15px; background: #0f0; color: #000; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
#topbar button.orange { background: orange; }
#topbar button.blue { background: #00aaff; }
#topbar button.red { background: red; color: white; }
#topbar button.purple { background: purple; color: white; }
#topbar button:disabled { background: #555; cursor: not-allowed; }
#videoGrid { display: flex; flex-wrap: wrap; gap: 5px; padding: 5px; background: #1a1a1a; border-bottom: 2px solid #0f0; max-height: 25vh; overflow-y: auto; }
.video-box { width: 160px; height: 120px; background: #000; border: 2px solid #333; border-radius: 5px; position: relative; }
.video-box video { width: 100%; height: 100%; object-fit: cover; }
.video-box span { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); padding: 2px; font-size: 12px; }
#main { flex: 1; display: flex; overflow: hidden; }
#viewerArea { flex: 1; background: #000; position: relative; overflow: auto; display: flex; align-items: center; justify-content: center; }
#canvas { width: 100%; height: 100%; object-fit: contain; background: #000; }
#imageView { max-width: 100%; max-height: 100%; display: none; }
#audioView { width: 90%; display: none; }
#pdfView { width: 100%; height: 100%; overflow-y: auto; display: none; background: #555; }
#pdfView canvas { display: block; margin: 10px auto; box-shadow: 0 0 10px #000; }
#txtView { width: 100%; height: 100%; padding: 20px; background: #222; color: #eee; overflow-y: auto; display: none; white-space: pre-wrap; font-size: 16px; line-height: 1.8; }
#chat { width: 280px; background: #1a1a1a; display: flex; flex-direction: column; border-right: 2px solid #0f0; }
#messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 14px; }
.msg { margin: 5px 0; padding: 6px; background: #333; border-radius: 5px; }
.msg b { color: #0f0; }
#chatInput { display: flex; padding: 10px; gap: 5px; }
#chatInput input { flex: 1; padding: 8px; background: #333; color: #fff; border: 1px solid #555; }
#chatInput button { padding: 8px 12px; background: #0f0; border: none; cursor: pointer; }
#controls { background: #222; padding: 10px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
#controls button { padding: 10px 20px; background: #0f0; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
#emojiBar { background: #222; padding: 10px; display: flex; gap: 10px; justify-content: center; font-size: 24px; }
#emojiBar span { cursor: pointer; transition: transform 0.2s; }
#emojiBar span:hover { transform: scale(1.3); }
.flying-emoji { position: absolute; font-size: 32px; animation: flyUp 3s linear forwards; pointer-events: none; }
@keyframes flyUp { 0% { bottom: 0; opacity: 1; transform: translateX(0); } 100% { bottom: 100%; opacity: 0; transform: translateX(20px); } }
</style>
</head>
<body>

<div id="topbar">
    <label>📁 رفع ملف: <input type="file" id="upload" accept="video/*,audio/*,image/*,.pdf,.txt"></label>
    <input type="text" id="myId" placeholder="اسمك" value="host">
    <input type="text" id="friendId" placeholder="اسم صاحبك">
    <button id="create">1. انشاء غرفة</button>
    <button id="join">2. دخول غرفة</button>
    <button id="voiceBtn">🎤 صوت</button>
    <button id="videoBtn" class="blue">📹 كاميرا</button>
    <span id="status" style="color:#ff0">اكتب اسمك</span>
</div>

<div id="videoGrid"></div>

<div id="main">
    <div id="viewerArea">
        <video id="canvas" controls></video>
        <img id="imageView">
        <audio id="audioView" controls></audio>
        <div id="pdfView"></div>
        <div id="txtView"></div>
    </div>
    <div id="chat">
        <div id="messages"></div>
        <div id="chatInput">
            <input type="text" id="msgText" placeholder="اكتب...">
            <button id="sendMsg">ارسال</button>
        </div>
    </div>
</div>

<div id="emojiBar">
    <span onclick="sendEmoji('❤️')">❤️</span>
    <span onclick="sendEmoji('😂')">😂</span>
    <span onclick="sendEmoji('🔥')">🔥</span>
    <span onclick="sendEmoji('👏')">👏</span>
    <span onclick="sendEmoji('😮')">😮</span>
    <span onclick="sendEmoji('💯')">💯</span>
</div>

<div id="controls">
    <button id="play">▶️ تشغيل</button>
    <button id="pause">⏸️ ايقاف</button>
    <button id="prevPage" style="display:none;">⬅️ السابق</button>
    <button id="nextPage" style="display:none;">التالي ➡️</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let video = document.getElementById('canvas');
let imageView = document.getElementById('imageView');
let audioView = document.getElementById('audioView');
let pdfView = document.getElementById('pdfView');
let txtView = document.getElementById('txtView');
let viewerArea = document.getElementById('viewerArea');
let videoGrid = document.getElementById('videoGrid');

let peer, conn, call; // منطق V4: conn واحد بس
let myName = "انا";
let isSyncing = false; // مفتاح المزامنة من V4
let isHost = false;
let localStream = null;
let localVideoStream = null;
let inVoice = false;
let inVideo = false;
let mediaChunks = [];
let mediaType = "";
let pdfDoc = null;
let currentPage = 1;

// === 1. الكاميرا والصوت ===
document.getElementById('voiceBtn').onclick = async function(){
    if(!inVoice){
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        inVoice = true; document.getElementById('voiceBtn').className = "red"; document.getElementById('voiceBtn').innerText = "🔇 صوت";
        if(conn) call = peer.call(conn.peer, localStream);
    } else {
        inVoice = false; document.getElementById('voiceBtn').className = ""; document.getElementById('voiceBtn').innerText = "🎤 صوت";
        if(localStream) localStream.getTracks().forEach(t=>t.stop());
        if(call) call.close();
    }
}
document.getElementById('videoBtn').onclick = async function(){
    if(!inVideo){
        localVideoStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        inVideo = true; document.getElementById('videoBtn').className = "red"; document.getElementById('videoBtn').innerText = "📵 كاميرا";
        addVideoBox(myName, localVideoStream, true);
        if(conn) call = peer.call(conn.peer, localVideoStream);
    } else {
        inVideo = false; document.getElementById('videoBtn').className = "blue"; document.getElementById('videoBtn').innerText = "📹 كاميرا";
        if(localVideoStream) localVideoStream.getTracks().forEach(t=>t.stop());
        if(call) call.close();
        removeVideoBox(myName);
    }
}
function addVideoBox(id, stream, isMe){
    removeVideoBox(id);
    let box = document.createElement('div'); box.id = 'vid-' + id; box.className = 'video-box';
    let v = document.createElement('video'); v.srcObject = stream; v.autoplay = true; v.muted = isMe; box.appendChild(v);
    let span = document.createElement('span'); span.innerText = id + (isMe?' انت':''); box.appendChild(span);
    videoGrid.appendChild(box);
}
function removeVideoBox(id){ let b = document.getElementById('vid-'+id); if(b) b.remove(); }

// === 2. الايموجي ===
function sendEmoji(emoji){ if(conn) send({type: 'emoji', emoji: emoji}); showEmoji(emoji); }
function showEmoji(emoji){
    let el = document.createElement('div'); el.className = 'flying-emoji'; el.innerText = emoji;
    el.style.left = Math.random() * 80 + 10 + '%'; viewerArea.appendChild(el); setTimeout(()=>el.remove(), 3000);
}

// === 3. رفع الملفات المتعددة - منطق جديد بس بنفس فكرة V4 ===
document.getElementById('upload').onchange = function(e){
    let file = e.target.files[0];
    if(!file ||!conn) return;
    addMsg("النظام", "جاري رفع: " + file.name + "...");
    hideAllMedia();

    if(file.type.startsWith('video/')){ mediaType = 'video'; video.style.display = 'block'; }
    else if(file.type.startsWith('audio/')){ mediaType = 'audio'; audioView.style.display = 'block'; }
    else if(file.type.startsWith('image/')){ mediaType = 'image'; imageView.style.display = 'block'; }
    else if(file.type == 'application/pdf'){ mediaType = 'pdf'; pdfView.style.display = 'block'; }
    else { mediaType = 'txt'; txtView.style.display = 'block'; }

    let reader = new FileReader();
    reader.onload = function(evt){
        let base64 = evt.target.result;
        if(mediaType == 'video'){ video.src = base64; video.load(); }
        if(mediaType == 'audio'){ audioView.src = base64; audioView.load(); }
        if(mediaType == 'image'){ imageView.src = base64; }
        if(mediaType == 'txt'){ txtView.innerText = atob(base64.split(',')[1]); }

        send({type: 'mediaStart', typeFile: mediaType, name: file.name});
        sendInChunks(base64); // تقسيم الملف عشان ما يضرب
    }
    reader.readAsDataURL(file);
}

function sendInChunks(base64){
    const chunkSize = 16000; // اكبر شوية من V4 عشان يكون اسرع
    for(let i = 0; i < base64.length; i += chunkSize){
        send({type: 'mediaChunk', data: base64.slice(i, i + chunkSize)});
    }
    send({type: 'mediaEnd'});
    addMsg("النظام", "تم ارسال الملف كامل");
}

function hideAllMedia(){
    video.style.display = 'none'; imageView.style.display = 'none';
    audioView.style.display = 'none'; pdfView.style.display = 'none'; txtView.style.display = 'none';
    video.pause(); audioView.pause();
    document.getElementById('prevPage').style.display = 'none'; document.getElementById('nextPage').style.display = 'none';
}

function renderPdfPage(p){
    pdfDoc.getPage(p).then(page=>{
        let v = page.getViewport({scale: 1.5});
        let c = document.createElement('canvas'); c.height = v.height; c.width = v.width;
        pdfView.innerHTML = ""; pdfView.appendChild(c);
        page.render({canvasContext: c.getContext('2d'), viewport: v});
    });
}
document.getElementById('nextPage').onclick = ()=>{ if(pdfDoc && currentPage < pdfDoc.numPages){ currentPage++; renderPdfPage(currentPage); send({type: 'docPage', page: currentPage}); } }
document.getElementById('prevPage').onclick = ()=>{ if(pdfDoc && currentPage > 1){ currentPage--; renderPdfPage(currentPage); send({type: 'docPage', page: currentPage}); } }

// === 4. الشات ===
function addMsg(name, text){
    let div = document.createElement('div'); div.className = 'msg';
    div.innerHTML = "<b>" + name + ":</b> " + text;
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop = 99999;
}
document.getElementById('sendMsg').onclick = function(){
    let text = document.getElementById('msgText').value;
    if(text!= "" && conn){
        addMsg(myName, text);
        send({type: 'chat', name: myName, text: text});
        document.getElementById('msgText').value = '';
    }
}

// === 5. الاتصال - نفس منطق V4 بالضبط ===
document.getElementById('create').onclick = function(){
    myName = document.getElementById('myId').value;
    peer = new Peer(myName);
    peer.on('open', id=>{ document.getElementById('status').innerText = "الغرفة جاهزة: " + id; });
    peer.on('connection', c=>{ conn = c; isHost = true; setupConn(); });
    peer.on('call', c=>{
        c.answer(inVideo? localVideoStream : localStream);
        c.on('stream', s=> addVideoBox(c.peer, s, false));
    });
}

document.getElementById('join').onclick = function(){
    myName = document.getElementById('myId').value;
    let friend = document.getElementById('friendId').value;
    peer = new Peer(myName + "-guest");
    peer.on('open', id=>{
        document.getElementById('status').innerText = "بحاول اتصل على: " + friend;
        conn = peer.connect(friend);
        setupConn();
    });
    peer.on('call', c=>{
        c.answer(inVideo? localVideoStream : localStream);
        c.on('stream', s=> addVideoBox(c.peer, s, false));
    });
}

function setupConn(){
    conn.on('open', ()=>{ document.getElementById('status').innerText = "تم الاتصال مع " + conn.peer; addMsg("النظام", "تم الاتصال!"); });
    conn.on('data', data=>{
        isSyncing = true; // من V4
        if(data.type == 'mediaStart'){
            mediaChunks = []; mediaType = data.typeFile; hideAllMedia();
            if(mediaType=='video') video.style.display='block';
            if(mediaType=='audio') audioView.style.display='block';
            if(mediaType=='image') imageView.style.display='block';
            if(mediaType=='pdf') pdfView.style.display='block';
            if(mediaType=='txt') txtView.style.display='block';
            addMsg("النظام", "جاري استلام: " + data.name);
        }
        if(data.type == 'mediaChunk'){ mediaChunks.push(data.data); }
        if(data.type == 'mediaEnd'){
            let base64 = mediaChunks.join('');
            if(mediaType == 'video'){ video.src = base64; video.load(); }
            if(mediaType == 'audio'){ audioView.src = base64; audioView.load(); }
            if(mediaType == 'image') imageView.src = base64;
            if(mediaType == 'txt'){ txtView.innerText = atob(base64.split(',')[1]); }
            if(mediaType == 'pdf'){
                let pdfData = atob(base64.split(',')[1]);
                pdfjsLib.getDocument({data: pdfData}).promise.then(pdf=>{ pdfDoc = pdf; currentPage = 1; renderPdfPage(1); document.getElementById('prevPage').style.display='inline-block'; document.getElementById('nextPage').style.display='inline-block'; });
            }
            addMsg("النظام", "تم استلام الملف");
        }
        if(data.type == 'chat'){ addMsg(data.name, data.text); }
        if(data.type == 'emoji'){ showEmoji(data.emoji); }
        if(data.type == 'play'){ (mediaType=='video'?video:audioView).currentTime = data.time; (mediaType=='video'?video:audioView).play(); }
        if(data.type == 'pause'){ (mediaType=='video'?video:audioView).currentTime = data.time; (mediaType=='video'?video:audioView).pause(); }
        if(data.type == 'seek'){ (mediaType=='video'?video:audioView).currentTime = data.time; }
        if(data.type == 'docPage'){ currentPage=data.page; if(mediaType=='pdf') renderPdfPage(currentPage); }
        setTimeout(()=>{ isSyncing = false; }, 100); // من V4
    });
}

// === 6. ارسال الاوامر - نفس منطق V4 ===
function send(data){ if(conn &&!isSyncing) conn.send(data); }

video.onplay = ()=>{ if(isHost) send({type: 'play', time: video.currentTime}); }
video.onpause = ()=>{ if(isHost) send({type: 'pause', time: video.currentTime}); }
video.onseeked = ()=>{ if(isHost) send({type: 'seek', time: video.currentTime}); }
audioView.onplay = ()=>{ if(isHost) send({type: 'play', time: audioView.currentTime}); }
audioView.onpause = ()=>{ if(isHost) send({type: 'pause', time: audioView.currentTime}); }
audioView.onseeked = ()=>{ if(isHost) send({type: 'seek', time: audioView.currentTime}); }

document.getElementById('play').onclick = ()=>{ (mediaType=='video'?video:audioView).play(); }
document.getElementById('pause').onclick = ()=>{ (mediaType=='video'?video:audioView).pause(); }

</script>
</body>
</html>
