<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Mazis Cast Sync V4.1</title>
<style>
body { margin: 0; background: #111; color: #fff; font-family: Arial; display: flex; flex-direction: column; height: 100vh; }
#topbar { background: #222; padding: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#topbar input { padding: 5px; background: #333; color: #fff; border: 1px solid #555; }
#topbar button { padding: 5px 15px; background: #0f0; color: #000; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
#main { flex: 1; display: flex; overflow: hidden; }
#viewerArea { flex: 1; background: #000; position: relative; overflow: auto; display: flex; align-items: center; justify-content: center; }
#canvas { width: 100%; height: 100%; object-fit: contain; background: #000; }
#imageView { max-width: 100%; max-height: 100%; display: none; }
#audioView { width: 90%; display: none; }
#pdfView { width: 100%; height: 100%; overflow-y: auto; display: none; background: #333; }
#pdfView canvas { display: block; margin: 10px auto; }
#txtView { width: 100%; height: 100%; padding: 20px; background: #222; color: #eee; overflow-y: auto; display: none; white-space: pre-wrap; font-size: 16px; line-height: 1.8; }
#chat { width: 280px; background: #1a1a1a; display: flex; flex-direction: column; border-right: 2px solid #0f0; }
#messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 14px; }
.msg { margin: 5px 0; padding: 6px; background: #333; border-radius: 5px; }
.msg b { color: #0f0; }
.msg.sys { color: #ff0; }
#chatInput { display: flex; padding: 10px; gap: 5px; }
#chatInput input { flex: 1; padding: 8px; background: #333; color: #fff; border: 1px solid #555; }
#chatInput button { padding: 8px 12px; background: #0f0; border: none; cursor: pointer; }
#controls { background: #222; padding: 10px; display: flex; gap: 10px; justify-content: center; }
#controls button { padding: 10px 20px; background: #0f0; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<div id="topbar">
    <label>📁 رفع ملف: <input type="file" id="upload" accept="video/*,audio/*,image/*,.pdf,.txt"></label> <!-- التعديل 1 -->
    <input type="text" id="myId" placeholder="اسمك" value="host">
    <input type="text" id="friendId" placeholder="اسم صاحبك">
    <button id="create">1. انشاء غرفة</button>
    <button id="join">2. دخول غرفة</button>
    <span id="status" style="color:#ff0">اكتب اسمك</span>
</div>

<div id="main">
    <div id="viewerArea">
        <video id="canvas" controls></video>
        <img id="imageView">
        <audio id="audioView" controls></audio>
        <div id="pdfView"></div>
        <div id="txtView"></div>
    </div>
    <div id="chat">
        <div id="messages"></div>
        <div id="chatInput">
            <input type="text" id="msgText" placeholder="اكتب...">
            <button id="sendMsg">ارسال</button>
        </div>
    </div>
</div>

<div id="controls">
    <button id="play">▶️ تشغيل</button>
    <button id="pause">⏸️ ايقاف</button>
    <button id="prevPage" style="display:none;">⬅️ السابق</button> <!-- التعديل 2 -->
    <button id="nextPage" style="display:none;">التالي ➡️</button> <!-- التعديل 2 -->
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script> <!-- عشان ال PDF -->
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let video = document.getElementById('canvas');
let imageView = document.getElementById('imageView');
let audioView = document.getElementById('audioView');
let pdfView = document.getElementById('pdfView');
let txtView = document.getElementById('txtView');
let viewerArea = document.getElementById('viewerArea');
let peer, conn;
let myName = "انا";
let isSyncing = false; // ده المفتاح عشان ما نعمل لوب
let mediaType = ""; // جديد: نوع الملف الحالي
let mediaChunks = []; // جديد: لتجميع الملف
let pdfDoc = null; // جديد
let currentPage = 1; // جديد

// === 1. رفع الملف + ارسالو - متعدد الانواع ===
document.getElementById('upload').onchange = function(e){
    let file = e.target.files[0];
    if(!file) return;

    hideAllMedia(); // اخفي اي شي فاتح
    addMsg("النظام", "تم رفع: " + file.name);

    // حدد نوع الملف
    if(file.type.startsWith('video/')){ mediaType = 'video'; video.style.display = 'block'; }
    else if(file.type.startsWith('audio/')){ mediaType = 'audio'; audioView.style.display = 'block'; }
    else if(file.type.startsWith('image/')){ mediaType = 'image'; imageView.style.display = 'block'; }
    else if(file.type == 'application/pdf'){ mediaType = 'pdf'; pdfView.style.display = 'block'; }
    else { mediaType = 'txt'; txtView.style.display = 'block'; }

    let reader = new FileReader();
    reader.onload = function(evt){
        let base64 = evt.target.result;
        // شغل عندي انا اول
        if(mediaType == 'video'){ video.src = base64; video.load(); }
        if(mediaType == 'audio'){ audioView.src = base64; audioView.load(); }
        if(mediaType == 'image'){ imageView.src = base64; }
        if(mediaType == 'txt'){ txtView.innerText = atob(base64.split(',')[1]); }
        if(mediaType == 'pdf'){
            let pdfData = atob(base64.split(',')[1]);
            pdfjsLib.getDocument({data: pdfData}).promise.then(pdf=>{ pdfDoc = pdf; currentPage = 1; renderPdfPage(1); document.getElementById('prevPage').style.display='inline'; document.getElementById('nextPage').style.display='inline'; });
        }

        if(conn){
            addMsg("النظام", "برسل الملف لصاحبك...");
            // ارسال بالـ chunks عشان الملفات الكبيرة ما تضرب
            send({type: 'mediaStart', typeFile: mediaType, name: file.name});
            sendInChunks(base64);
            send({type: 'mediaEnd'});
            addMsg("النظام", "تم الارسال كامل ✓");
        }
    }
    reader.readAsDataURL(file);
}

function sendInChunks(base64){
    const chunkSize = 16000;
    for(let i = 0; i < base64.length; i += chunkSize){
        send({type: 'mediaChunk', data: base64.slice(i, i + chunkSize)});
    }
}

function hideAllMedia(){
    video.style.display = 'none'; imageView.style.display = 'none';
    audioView.style.display = 'none'; pdfView.style.display = 'none'; txtView.style.display = 'none';
    video.pause(); audioView.pause(); video.src = ""; audioView.src = "";
    document.getElementById('prevPage').style.display = 'none'; document.getElementById('nextPage').style.display = 'none';
}

function renderPdfPage(p){
    pdfDoc.getPage(p).then(page=>{
        let v = page.getViewport({scale: 1.5});
        let c = document.createElement('canvas'); c.height = v.height; c.width = v.width;
        pdfView.innerHTML = ""; pdfView.appendChild(c);
        page.render({canvasContext: c.getContext('2d'), viewport: v});
    });
}

// ازرار تقليب الصفحات
document.getElementById('nextPage').onclick = function(){
    if(pdfDoc && currentPage < pdfDoc.numPages){
        currentPage++;
        renderPdfPage(currentPage);
        send({type: 'docPage', page: currentPage});
    }
}
document.getElementById('prevPage').onclick = function(){
    if(pdfDoc && currentPage > 1){
        currentPage--;
        renderPdfPage(currentPage);
        send({type: 'docPage', page: currentPage});
    }
}

// مزامنة السكرول
viewerArea.onscroll = function(){
    if(!isSyncing && (mediaType == 'pdf' || mediaType == 'txt')){
        send({type: 'docScroll', scroll: viewerArea.scrollTop});
    }
}

// === 2. الدردشة ===
function addMsg(name, text){
    let div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = "<b>" + name + ":</b> " + text;
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop = 99999;
}

document.getElementById('sendMsg').onclick = function(){
    let text = document.getElementById('msgText').value;
    if(text!= "" && conn){
        addMsg(myName, text);
        send({type: 'chat', name: myName, text: text});
        document.getElementById('msgText').value = '';
    }
}

// === 3. الاتصال ===
document.getElementById('create').onclick = function(){
    myName = document.getElementById('myId').value;
    peer = new Peer(myName);
    peer.on('open', function(id){ document.getElementById('status').innerText = "الغرفة جاهزة: " + id; });
    peer.on('connection', function(c){ conn = c; setupConn(); });
}

document.getElementById('join').onclick = function(){
    myName = document.getElementById('myId').value;
    let friend = document.getElementById('friendId').value;
    peer = new Peer(myName + "-guest");
    peer.on('open', function(id){
        document.getElementById('status').innerText = "بحاول اتصل على: " + friend;
        conn = peer.connect(friend);
        setupConn();
    });
}

function setupConn(){
    conn.on('open', function(){
        document.getElementById('status').innerText = "تم الاتصال!";
        addMsg("النظام", "تم الاتصال مع " + conn.peer);
    });

    conn.on('data', function(data){
        isSyncing = true; // بقول انا بزامن هسي ما ترسل تاني
        if(data.type == 'play'){
            (mediaType=='video'?video:audioView).currentTime = data.time;
            (mediaType=='video'?video:audioView).play();
        }
        if(data.type == 'pause'){
            (mediaType=='video'?video:audioView).currentTime = data.time;
            (mediaType=='video'?video:audioView).pause();
        }
        if(data.type == 'seek'){
            (mediaType=='video'?video:audioView).currentTime = data.time;
        }
        if(data.type == 'chat'){ addMsg(data.name, data.text); }

        // استقبال الملفات الجديدة
        if(data.type == 'mediaStart'){
            mediaChunks = []; mediaType = data.typeFile; hideAllMedia();
            if(mediaType=='video') video.style.display='block';
            if(mediaType=='audio') audioView.style.display='block';
            if(mediaType=='image') imageView.style.display='block';
            if(mediaType=='pdf') pdfView.style.display='block';
            if(mediaType=='txt') txtView.style.display='block';
            addMsg("النظام", "جاري استلام: " + data.name + "...");
        }
        if(data.type == 'mediaChunk'){ mediaChunks.push(data.data); }
        if(data.type == 'mediaEnd'){
            let base64 = mediaChunks.join('');
            if(mediaType == 'video'){ video.src = base64; video.load(); }
            if(mediaType == 'audio'){ audioView.src = base64; audioView.load(); }
            if(mediaType == 'image') imageView.src = base64;
            if(mediaType == 'txt'){ txtView.innerText = atob(base64.split(',')[1]); }
            if(mediaType == 'pdf'){
                let pdfData = atob(base64.split(',')[1]);
                pdfjsLib.getDocument({data: pdfData}).promise.then(pdf=>{ pdfDoc = pdf; currentPage = 1; renderPdfPage(1); document.getElementById('prevPage').style.display='inline'; document.getElementById('nextPage').style.display='inline'; });
            }
            addMsg("النظام", "تم الاستلام كامل ✓");
        }
        if(data.type == 'docPage'){ currentPage=data.page; if(mediaType=='pdf') renderPdfPage(currentPage); }
        if(data.type == 'docScroll'){ viewerArea.scrollTop = data.scroll; }

        setTimeout(function(){ isSyncing = false; }, 100); // بعد 0.1 ثانية ارجع عادي
    });
}

// === 4. ارسال اوامر الفيديو - ده التعديل المهم ===
function send(data){ if(conn &&!isSyncing) conn.send(data); }

// اي حركة في الفيديو ترسلها
video.onplay = function(){ send({type: 'play', time: video.currentTime}); }
video.onpause = function(){ send({type: 'pause', time: video.currentTime}); }
video.onseeked = function(){ send({type: 'seek', time: video.currentTime}); }
audioView.onplay = function(){ send({type: 'play', time: audioView.currentTime}); }
audioView.onpause = function(){ send({type: 'pause', time: audioView.currentTime}); }
audioView.onseeked = function(){ send({type: 'seek', time: audioView.currentTime}); }

// الازرار
document.getElementById('play').onclick = function(){ (mediaType=='video'?video:audioView).play(); }
document.getElementById('pause').onclick = function(){ (mediaType=='video'?video:audioView).pause(); }

</script>
</body>
</html>
