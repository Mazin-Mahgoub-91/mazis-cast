<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teleparty App</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #111; color: #fff; font-family: Arial; display: flex; flex-direction: column; min-height: 100vh; }
#topbar { background: #222; padding: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; }
#appName { font-size: 14px; font-weight: bold; color: #0f0; }
#topbar input[type="text"] { padding: 6px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
#topbar input[type="file"] { display: none; }
#topbar label.uploadBtn { padding: 8px 12px; color: #fff; cursor: pointer; border-radius: 5px; font-weight: bold; }
#topbar button { padding: 8px 12px; background: #0f0; color: #000; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
#topbar button.tool { background: #555; color: #fff; }
#topbar button.tool.active { background: orange; }
#topbar button.blue { background: #00aaff; color: white; }
#topbar button.red { background: red; color: white; }
#videoGrid { display: flex; flex-wrap: wrap; gap: 5px; padding: 5px; background: #1a1a1a; border-bottom: 2px solid #0f0; }
.video-box { width: 150px; height: 110px; background: #000; border: 2px solid #333; border-radius: 5px; position: relative; overflow: hidden; }
.video-box video { width: 100%; height: 100%; object-fit: cover; }
.video-box span { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); padding: 2px; font-size: 11px; text-align: center; }
#main { flex: 1; display: flex; overflow: visible; }
#viewerArea { flex: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; min-height: 400px; flex-direction: column; }
#canvas { width: 100%; max-height: 70vh; background: #000; display: none; }
#imageView { max-width: 100%; max-height: 70vh; display: none; }
#audioView { width: 90%; display: none; }
#pdfView { width: 100%; height: 600px; overflow-y: auto; display: none; background: #333; }
#txtView { width: 100%; max-height: 600px; padding: 20px; background: #222; color: #eee; overflow-y: auto; display: none; white-space: pre-wrap; }
#annotationCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }
#viewerArea.annotation #annotationCanvas { pointer-events: auto; }
#chat { width: 320px; background: #1a1a1a; display: flex; flex-direction: column; border-right: 2px solid #0f0; min-height: 400px; }
#messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 14px; }
.msg { margin: 5px 0; padding: 8px; background: #333; border-radius: 5px; word-break: break-word; }
.msg.err { background: #600; color: #fff; border: 1px solid red; }
.msg b { color: #0f0; }
.msg.sys { color: #ff0; background: #444; }
#chatInput { display: flex; padding: 10px; gap: 5px; background: #1a1a1a; }
#chatInput input { flex: 1; padding: 8px; background: #333; color: #fff; border: 1px solid #555; }
#controls { background: #222; padding: 10px; display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
#controls button { padding: 8px 15px; background: #0f0; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
#emojiBar { display: flex; gap: 12px; font-size: 26px; }
#emojiBar span { cursor: pointer; }
.flying-emoji { position: absolute; font-size: 32px; animation: flyUp 3s linear forwards; pointer-events: none; z-index: 20; }
@keyframes flyUp { 0% { bottom: 10%; opacity: 1; } 100% { bottom: 90%; opacity: 0; } }
@media (max-width: 768px) { body { display: block; overflow-y: auto; height: auto; } #main { display: block; } #viewerArea { min-height: 250px; width: 100%; } #chat { width: 100%; min-height: 350px; border-right: none; border-top: 3px solid #0f0; } }
</style>
</head>
<body>

<div id="topbar">
    <div id="appName">Teleparty App</div>
    <label for="uploadMedia" class="uploadBtn" style="background:#00aaff;">رفع فيديو / صوت</label>
    <input type="file" id="uploadMedia" accept="video/*,audio/*">
    <label for="uploadDoc" class="uploadBtn" style="background:#ff8800;">رفع PDF / TXT</label>
    <input type="file" id="uploadDoc" accept=".pdf,.txt">
    <label for="uploadImage" class="uploadBtn" style="background:#aa00ff;">رفع صور</label>
    <input type="file" id="uploadImage" accept="image/*">
    <input type="text" id="myId" placeholder="اسمك" value="host">
    <input type="text" id="friendId" placeholder="اسم صاحبك">
    <button id="create">انشاء غرفة</button>
    <button id="join">دخول غرفة</button>
    <button id="voiceBtn">تشغيل الصوت</button>
    <button id="videoBtn" class="blue">تشغيل الكاميرا</button>
    <span id="status" style="color:#ff0">جاهز</span>
</div>
<div id="videoGrid"></div>
<div id="main">
    <div id="viewerArea">
        <video id="canvas" controls playsinline></video>
        <img id="imageView">
        <audio id="audioView" controls></audio>
        <div id="pdfView"></div>
        <div id="txtView"></div>
        <canvas id="annotationCanvas"></canvas>
    </div>
    <div id="chat">
        <div id="messages"></div>
        <div id="chatInput">
            <input type="text" id="msgText" placeholder="اكتب رسالتك هنا...">
            <button id="sendMsg">ارسال</button>
        </div>
    </div>
</div>
<div id="controls">
    <button id="play">تشغيل</button>
    <button id="pause">ايقاف</button>
    <div id="emojiBar">
        <span onclick="sendEmoji('❤️')">❤️</span><span onclick="sendEmoji('😂')">😂</span>
        <span onclick="sendEmoji('🔥')">🔥</span><span onclick="sendEmoji('👏')">👏</span>
        <span onclick="sendEmoji('😮')">😮</span><span onclick="sendEmoji('💯')">💯</span>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let video = document.getElementById('canvas');
let imageView = document.getElementById('imageView');
let audioView = document.getElementById('audioView');
let pdfView = document.getElementById('pdfView');
let txtView = document.getElementById('txtView');
let viewerArea = document.getElementById('viewerArea');
let annCanvas = document.getElementById('annotationCanvas');
let annCtx = annCanvas.getContext('2d');
let peer, conn, call, localStream, localVideoStream, mediaType="", mediaChunks=[], pdfDoc=null, currentPage=1, annotations=[], localObjectURL=null, myName="انا", isHost=false;

function addMsg(n,t){ let d=document.createElement('div'); d.className='msg'; d.innerHTML="<b>"+n+":</b> "+t; document.getElementById('messages').appendChild(d); document.getElementById('messages').scrollTop=99999; }
function addSysMsg(t){ let d=document.createElement('div'); d.className='msg sys'; d.innerHTML="<b>النظام:</b> "+t; document.getElementById('messages').appendChild(d); document.getElementById('messages').scrollTop=99999; }
function addErrMsg(t){ let d=document.createElement('div'); d.className='msg err'; d.innerHTML="<b>خطأ فيديو:</b> "+t; document.getElementById('messages').appendChild(d); document.getElementById('messages').scrollTop=99999; }

function hideAllMedia(){
    // لا نحذف الرابط القديم الا بعد انشاء الجديد
    video.pause(); audioView.pause();
    video.style.display='none'; imageView.style.display='none'; audioView.style.display='none'; pdfView.style.display='none'; txtView.style.display='none';
}

// === الحل: تشغيل لابتوب بسيط جدا زي V4 ===
function playVideoFile(file){
    hideAllMedia();
    mediaType = file.type.startsWith('video/')? 'video' : 'audio';
    if(localObjectURL) { try{ URL.revokeObjectURL(localObjectURL); }catch(e){} }
    localObjectURL = URL.createObjectURL(file);

    if(mediaType=='video'){
        video.style.display='block';
        video.src = localObjectURL;
        video.onerror = function(){
            let err = video.error;
            addErrMsg("كود الخطأ " + (err? err.code : 'مجهول') + " - " + (err? err.message : '') + " | النوع: " + file.type + " | جرب تغير اسم الملف لانجليزي او جرب متصفح تاني");
        };
        video.onloadedmetadata = function(){ addSysMsg("الفيديو جاهز: " + video.duration.toFixed(1) + " ثانية - دوس تشغيل"); };
        video.oncanplay = function(){ addSysMsg("يمكن التشغيل الان"); };
    } else {
        audioView.style.display='block';
        audioView.src = localObjectURL;
    }
    addSysMsg("تم التحميل محلي: " + file.name);
}

document.getElementById('uploadMedia').onchange = function(e){
    let file = e.target.files[0]; if(!file) return;
    playVideoFile(file);
    if(conn){
        let reader = new FileReader();
        reader.onload = (ev)=>{ send({type:'mediaStart', typeFile:file.type.startsWith('video/')?'video':'audio', name:file.name, mime:file.type}); sendInChunks(ev.target.result); send({type:'mediaEnd'}); };
        reader.readAsDataURL(file);
    }
};

document.getElementById('uploadImage').onchange = function(e){
    let file = e.target.files[0]; if(!file) return;
    hideAllMedia();
    mediaType='image';
    if(localObjectURL) URL.revokeObjectURL(localObjectURL);
    localObjectURL = URL.createObjectURL(file);
    imageView.style.display='block'; imageView.src = localObjectURL;
    addSysMsg("تم تحميل صورة: " + file.name);
    if(conn){
        let reader = new FileReader(); reader.onload=(ev)=>{ send({type:'mediaStart', typeFile:'image', name:file.name, mime:file.type}); sendInChunks(ev.target.result); send({type:'mediaEnd'}); }; reader.readAsDataURL(file);
    }
};

document.getElementById('uploadDoc').onchange = function(e){
    let file = e.target.files[0]; if(!file) return;
    hideAllMedia();
    mediaType = file.type == 'application/pdf'? 'pdf' : 'txt';
    if(mediaType=='pdf') pdfView.style.display='block'; else txtView.style.display='block';
    let reader = new FileReader();
    reader.onload = (ev)=>{
        if(mediaType=='txt') txtView.innerText = atob(ev.target.result.split(',')[1]);
        if(mediaType=='pdf') pdfjsLib.getDocument({data:ev.target.result}).promise.then(pdf=>{ pdfDoc=pdf; currentPage=1; renderPdfPage(1); });
        if(conn){ let data=ev.target.result; if(data instanceof ArrayBuffer){ let blob=new Blob([data]); let r2=new FileReader(); r2.onload=(e2)=>{ send({type:'mediaStart', typeFile:mediaType, name:file.name, mime:file.type}); sendInChunks(e2.target.result); send({type:'mediaEnd'}); }; r2.readAsDataURL(blob); } else { send({type:'mediaStart', typeFile:mediaType, name:file.name, mime:file.type}); sendInChunks(data); send({type:'mediaEnd'}); } }
    };
    if(mediaType=='pdf') reader.readAsArrayBuffer(file); else reader.readAsDataURL(file);
};

function sendInChunks(b64){ const s=16000; for(let i=0;i<b64.length;i+=s) send({type:'mediaChunk', data:b64.slice(i, i+s)}); }
function renderPdfPage(p){ pdfDoc.getPage(p).then(page=>{ let v=page.getViewport({scale:1.2}); let c=document.createElement('canvas'); c.width=v.width; c.height=v.height; pdfView.innerHTML=""; pdfView.appendChild(c); page.render({canvasContext:c.getContext('2d'), viewport:v}); }); }

document.getElementById('sendMsg').onclick=()=>{ let t=document.getElementById('msgText').value; if(t){ addMsg(myName,t); if(conn) send({type:'chat',name:myName,text:t}); document.getElementById('msgText').value=''; } }
document.getElementById('create').onclick=()=>{ myName=document.getElementById('myId').value; peer=new Peer(myName); peer.on('open',id=>{document.getElementById('status').innerText="غرفة: "+id;}); peer.on('connection',c=>{conn=c; isHost=true; setupConn();}); peer.on('call',c=>{c.answer(localVideoStream||localStream); c.on('stream',s=>addVideoBox(c.peer,s,false));}); }
document.getElementById('join').onclick=()=>{ myName=document.getElementById('myId').value; let f=document.getElementById('friendId').value; peer=new Peer(myName+"-guest"); peer.on('open',()=>{conn=peer.connect(f); setupConn();}); peer.on('call',c=>{c.answer(localVideoStream||localStream); c.on('stream',s=>addVideoBox(c.peer,s,false));}); }
function addVideoBox(id, stream){ let box=document.createElement('div'); box.id='vid-'+id; box.className='video-box'; let v=document.createElement('video'); v.srcObject=stream; v.autoplay=true; v.muted=id==myName; v.playsInline=true; box.appendChild(v); let span=document.createElement('span'); span.innerText=id; box.appendChild(span); document.getElementById('videoGrid').appendChild(box); }
function setupConn(){
    conn.on('open',()=>{document.getElementById('status').innerText="متصل"; addSysMsg("متصل");});
    conn.on('data',data=>{
        if(data.type=='mediaStart'){ mediaChunks=[]; mediaType=data.typeFile; hideAllMedia(); if(mediaType=='video')video.style.display='block'; if(mediaType=='audio')audioView.style.display='block'; if(mediaType=='image')imageView.style.display='block'; if(mediaType=='pdf')pdfView.style.display='block'; if(mediaType=='txt')txtView.style.display='block'; addSysMsg("جاري استلام: "+data.name); }
        if(data.type=='mediaChunk'){ mediaChunks.push(data.data); }
        if(data.type=='mediaEnd'){ let finalData=mediaChunks.join(''); if(mediaType=='video'||mediaType=='audio'||mediaType=='image'){ if(mediaType=='video'){video.src=finalData;} if(mediaType=='audio'){audioView.src=finalData;} if(mediaType=='image'){imageView.src=finalData;} } else { if(mediaType=='txt'){ try{txtView.innerText=atob(finalData.split(',')[1]);}catch(e){txtView.innerText=finalData;}} if(mediaType=='pdf'){ try{ let bin=atob(finalData.split(',')[1]); let arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); pdfjsLib.getDocument({data:arr}).promise.then(pdf=>{pdfDoc=pdf; currentPage=1; renderPdfPage(1);}); }catch(e){ addErrMsg("فشل PDF المستلم"); } } } addSysMsg("تم الاستلام"); }
        if(data.type=='chat'){addMsg(data.name,data.text);}
        if(data.type=='emoji'){ let el=document.createElement('div'); el.className='flying-emoji'; el.innerText=data.emoji; el.style.left=Math.random()*80+10+'%'; viewerArea.appendChild(el); setTimeout(()=>el.remove(),3000); }
        if(data.type=='play'){video.currentTime=data.time; video.play();}
        if(data.type=='pause'){video.currentTime=data.time; video.pause();}
        if(data.type=='seek'){video.currentTime=data.time;}
    });
}
function send(d){ if(conn) conn.send(d); }
function sendEmoji(e){ if(conn) send({type:'emoji', emoji:e}); let el=document.createElement('div'); el.className='flying-emoji'; el.innerText=e; el.style.left=Math.random()*80+10+'%'; viewerArea.appendChild(el); setTimeout(()=>el.remove(),3000); }
video.onplay=()=>{if(isHost && conn) send({type:'play',time:video.currentTime});}
video.onpause=()=>{if(isHost && conn) send({type:'pause',time:video.currentTime});}
video.onseeked=()=>{if(isHost && conn) send({type:'seek',time:video.currentTime});}
document.getElementById('play').onclick=()=>video.play();
document.getElementById('pause').onclick=()=>video.pause();
</script>
</body>
</html>
