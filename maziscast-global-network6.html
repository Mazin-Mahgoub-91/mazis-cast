<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Mazis Cast Room V7.2</title>
<style>
body { margin: 0; background: #111; color: #fff; font-family: Arial; display: flex; flex-direction: column; height: 100vh; }
#topbar { background: #222; padding: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#topbar input { padding: 5px; background: #333; color: #fff; border: 1px solid #555; }
#topbar button { padding: 5px 15px; background: #0f0; color: #000; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
#topbar button.orange { background: orange; }
#topbar button.blue { background: #00aaff; }
#topbar button.red { background: red; color: white; }
#topbar button.purple { background: purple; color: white; }
#topbar button:disabled { background: #555; cursor: not-allowed; }
#videoGrid { display: flex; flex-wrap: wrap; gap: 5px; padding: 5px; background: #1a1a1a; border-bottom: 2px solid #0f0; max-height: 25vh; overflow-y: auto; }
.video-box { width: 160px; height: 120px; background: #000; border: 2px solid #333; border-radius: 5px; position: relative; }
.video-box video { width: 100%; height: 100%; object-fit: cover; }
.video-box span { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); padding: 2px; font-size: 12px; }
#main { flex: 1; display: flex; overflow: hidden; }
#viewerArea { flex: 1; background: #000; position: relative; overflow: auto; display: flex; align-items: center; justify-content: center; }
#canvas { width: 100%; height: 100%; object-fit: contain; background: #000; }
#imageView { max-width: 100%; max-height: 100%; display: none; }
#audioView { width: 90%; display: none; }
#pdfView { width: 100%; height: 100%; overflow-y: auto; display: none; background: #555; }
#pdfView canvas { display: block; margin: 10px auto; box-shadow: 0 0 10px #000; }
#txtView { width: 100%; height: 100%; padding: 20px; background: #222; color: #eee; overflow-y: auto; display: none; white-space: pre-wrap; font-size: 16px; line-height: 1.8; }
#chat { width: 280px; background: #1a1a1a; display: flex; flex-direction: column; border-right: 2px solid #0f0; }
#messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 14px; }
.msg { margin: 5px 0; padding: 6px; background: #333; border-radius: 5px; }
.msg b { color: #0f0; }
.msg.admin { color: #ff0; }
#chatInput { display: flex; padding: 10px; gap: 5px; }
#chatInput input { flex: 1; padding: 8px; background: #333; color: #fff; border: 1px solid #555; }
#chatInput button { padding: 8px 12px; background: #0f0; border: none; cursor: pointer; }
#controls { background: #222; padding: 10px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
#controls button { padding: 10px 20px; background: #0f0; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
#emojiBar { background: #222; padding: 10px; display: flex; gap: 10px; justify-content: center; font-size: 24px; }
#emojiBar span { cursor: pointer; transition: transform 0.2s; }
#emojiBar span:hover { transform: scale(1.3); }
#users { background: #1a1a1a; padding: 5px; text-align: center; border-bottom: 1px solid #333; display: flex; flex-direction: column; max-height: 120px; overflow-y: auto; }
.user-item { display: flex; justify-content: space-between; padding: 3px 10px; }
.user-item.mic { color: #0f0; }
.user-item.cam { border-left: 3px solid #00aaff; }
.kick-btn { background: red; color: white; border: none; padding: 2px 8px; cursor: pointer; border-radius: 3px; font-size: 12px; }
.raise-btn { background: orange; color: white; border: none; padding: 2px 8px; cursor: pointer; border-radius: 3px; font-size: 12px; }
.flying-emoji { position: absolute; font-size: 32px; animation: flyUp 3s linear forwards; pointer-events: none; }
@keyframes flyUp { 0% { bottom: 0; opacity: 1; transform: translateX(0); } 100% { bottom: 100%; opacity: 0; transform: translateX(20px); } }
</style>
</head>
<body>

<div id="topbar">
    <label>📁 رفع ملف: <input type="file" id="upload" accept="video/*,audio/*,image/*,.pdf,.txt,.docx"></label>
    <input type="text" id="roomId" placeholder="كود الغرفة" value="mazis-room">
    <button id="join">دخول الغرفة</button>
    <button id="setName" class="purple">✏️ اكتب اسمك</button>
    <button id="beAdmin" class="orange">👑 كن الادمن</button>
    <button id="raiseHand" class="blue">✋ رفع اليد</button>
    <button id="voiceBtn">🎤 صوت</button>
    <button id="videoBtn" class="blue">📹 كاميرا</button>
    <span id="status" style="color:#0f0">غير متصل</span>
</div>

<div id="videoGrid"></div>

<div id="users"><b>المتصلين</b><div id="userList"></div></div>

<div id="main">
    <div id="viewerArea">
        <video id="canvas" controls></video>
        <img id="imageView">
        <audio id="audioView" controls></audio>
        <div id="pdfView"></div>
        <div id="txtView"></div>
    </div>
    <div id="chat">
        <div id="messages"></div>
        <div id="chatInput">
            <input type="text" id="msgText" placeholder="اكتب...">
            <button id="sendMsg">ارسال</button>
        </div>
    </div>
</div>

<div id="emojiBar">
    <span onclick="sendEmoji('❤️')">❤️</span>
    <span onclick="sendEmoji('😂')">😂</span>
    <span onclick="sendEmoji('🔥')">🔥</span>
    <span onclick="sendEmoji('👏')">👏</span>
    <span onclick="sendEmoji('😮')">😮</span>
    <span onclick="sendEmoji('💯')">💯</span>
</div>

<div id="controls">
    <button id="play">▶️ تشغيل</button>
    <button id="pause">⏸️ ايقاف</button>
    <button id="prevPage" style="display:none;">⬅️ السابق</button>
    <button id="nextPage" style="display:none;">التالي ➡️</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let video = document.getElementById('canvas');
let imageView = document.getElementById('imageView');
let audioView = document.getElementById('audioView');
let pdfView = document.getElementById('pdfView');
let txtView = document.getElementById('txtView');
let viewerArea = document.getElementById('viewerArea');
let videoGrid = document.getElementById('videoGrid');
let peer;
let connections = {};
let voiceCalls = {};
let videoCalls = {};
let myName = "user" + Math.floor(Math.random()*1000);
let currentAdmin = null;
let isSyncing = false;
let hostId = "";
let handRaised = {};
let adminTimer = null;
let localStream = null;
let localVideoStream = null;
let inVoice = false;
let inVideo = false;
let mediaChunks = [];
let mediaType = "";
let pdfDoc = null;
let currentPage = 1;
let isFileActive = false;

document.getElementById('setName').onclick = function(){
    let newName = prompt("اكتب اسمك داخل الغرفة:", myName);
    if(newName && newName.trim()!= ""){
        myName = newName.trim();
        broadcast({type: 'nameChange', name: myName});
        updateUI();
        addMsg("النظام", "تم تغيير اسمك الى: " + myName);
    }
}

document.getElementById('voiceBtn').onclick = async function(){
    if(!inVoice){
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            inVoice = true;
            document.getElementById('voiceBtn').innerText = "🔇 صوت";
            document.getElementById('voiceBtn').className = "red";
            addMsg("النظام", "دخلت القناة الصوتية 🎤");
            for(let id in connections){ callUser(id, 'audio'); }
        } catch(err){ alert("سمح بالوصول للمايكروفون اول"); }
    } else {
        inVoice = false;
        document.getElementById('voiceBtn').innerText = "🎤 صوت";
        document.getElementById('voiceBtn').className = "";
        if(localStream) localStream.getTracks().forEach(track => track.stop());
        for(let id in voiceCalls){ voiceCalls[id].close(); }
        voiceCalls = {};
        addMsg("النظام", "طلعت من القناة الصوتية");
        updateUI();
    }
}

document.getElementById('videoBtn').onclick = async function(){
    if(!inVideo){
        try {
            localVideoStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
            inVideo = true;
            document.getElementById('videoBtn').innerText = "📵 كاميرا";
            document.getElementById('videoBtn').className = "red";
            addVideoBox(myName, localVideoStream, true);
            addMsg("النظام", "شغلت الكاميرا 📹");
            for(let id in connections){ callUser(id, 'video'); }
        } catch(err){ alert("سمح بالوصول للكاميرا والمايك اول"); }
    } else {
        inVideo = false;
        document.getElementById('videoBtn').innerText = "📹 كاميرا";
        document.getElementById('videoBtn').className = "blue";
        if(localVideoStream) localVideoStream.getTracks().forEach(track => track.stop());
        for(let id in videoCalls){ videoCalls[id].close(); }
        videoCalls = {};
        removeVideoBox(myName);
        addMsg("النظام", "قفلت الكاميرا");
        updateUI();
    }
}

function callUser(id, type){
    let stream = type=='video'? localVideoStream : localStream;
    if(!stream ||!connections[id]) return;
    let call = peer.call(id, stream, {metadata: type});
    if(type=='audio') voiceCalls[id] = call;
    if(type=='video') videoCalls[id] = call;
    call.on('stream', function(remoteStream){
        if(type=='video') addVideoBox(id, remoteStream, false);
    });
    call.on('close', function(){
        if(type=='video') removeVideoBox(id);
    });
}

function addVideoBox(id, stream, isMe){
    removeVideoBox(id);
    let box = document.createElement('div');
    box.id = 'vid-' + id;
    box.className = 'video-box';
    let v = document.createElement('video');
    v.srcObject = stream;
    v.autoplay = true;
    v.muted = isMe;
    box.appendChild(v);
    let nameTag = document.createElement('span');
    nameTag.innerText = id + (isMe? ' انت' : '');
    box.appendChild(nameTag);
    videoGrid.appendChild(box);
}
function removeVideoBox(id){
    let box = document.getElementById('vid-' + id);
    if(box) box.remove();
}

function sendEmoji(emoji){
    broadcast({type: 'emoji', emoji: emoji});
    showEmoji(emoji);
}
function showEmoji(emoji){
    let el = document.createElement('div');
    el.className = 'flying-emoji';
    el.innerText = emoji;
    el.style.left = Math.random() * 80 + 10 + '%';
    viewerArea.appendChild(el);
    setTimeout(function(){ el.remove(); }, 3000);
}

// صلحت السطر 258 هنا. كان ناقص +
function updateUI(){
    let list = document.getElementById('userList');
    list.innerHTML = "";
    for(let id in connections){
        let div = document.createElement('div');
        div.className = 'user-item';
        if(voiceCalls[id]) div.classList.add('mic');
        if(videoCalls[id]) div.classList.add('cam');
        let buttons = "";
        if(currentAdmin == myName || hostId == myName){
            if(id!= myName) buttons = buttons + '<button class="kick-btn" onclick="kickUser(\'' + id + '\')">طرد</button> ';
        }
        if(currentAdmin == myName || hostId == myName){
            if(handRaised[id]) buttons = buttons + '<button class="raise-btn" onclick="giveControl(\'' + id + '\')">اعطاء تحكم</button>';
        }
        let adminIcon = id==currentAdmin? '👑' : handRaised[id]? '✋' : '';
        let micIcon = voiceCalls[id]? '🎤' : '';
        let camIcon = videoCalls[id]? '📹' : '';
        let displayName = id;
        div.innerHTML = '<span>' + displayName + ' ' + adminIcon + ' ' + micIcon + ' ' + camIcon + '</span> ' + buttons; // صلحت + الزيادة
        list.appendChild(div);
    }
}

document.getElementById('upload').onchange = function(e){
    let file = e.target.files[0];
    if(file){
        if(isFileActive){
            alert("⚠️ في ملف شغال حاليا. لازم تقفلو او تبدو غرفة جديدة عشان ترفع ملف جديد");
            e.target.value = "";
            return;
        }

        isFileActive = true;
        document.getElementById('upload').disabled = true;
        addMsg("النظام", "جاري رفع: " + file.name + " انتظر...");
        hideAllMedia();

        if(file.type.startsWith('video/')){ mediaType = 'video'; video.style.display = 'block'; }
        else if(file.type.startsWith('audio/')){ mediaType = 'audio'; audioView.style.display = 'block'; }
        else if(file.type.startsWith('image/')){ mediaType = 'image'; imageView.style.display = 'block'; }
        else if(file.type == 'application/pdf'){ mediaType = 'pdf'; pdfView.style.display = 'block'; }
        else if(file.type.startsWith('text/') || file.name.endsWith('.txt')){ mediaType = 'txt'; txtView.style.display = 'block'; }
        else if(file.name.endsWith('.docx')){ mediaType = 'txt'; txtView.style.display = 'block'; }
        else { alert("نوع الملف غير مدعوم"); isFileActive = false; document.getElementById('upload').disabled = false; return; }

        let reader = new FileReader();
        reader.onload = function(evt){
            let base64 = evt.target.result;
            if(mediaType == 'video'){ video.src = base64; video.load(); }
            if(mediaType == 'audio'){ audioView.src = base64; audioView.load(); }
            if(mediaType == 'image'){ imageView.src = base64; }
            if(mediaType == 'txt'){ txtView.innerText = atob(base64.split(',')[1]); }

            broadcast({type: 'mediaStart', name: file.name, type: mediaType, size: base64.length});
            sendInChunks(base64);
        }
        reader.readAsDataURL(file);
    }
}

function sendInChunks(base64){
    const chunkSize = 8000;
    let total = Math.ceil(base64.length / chunkSize);
    let sent = 0;
    for(let i = 0; i < base64.length; i += chunkSize){
        let chunk = base64.slice(i, i + chunkSize);
        broadcast({type: 'mediaChunk', data: chunk, index: sent, total: total});
        sent++;
    }
    broadcast({type: 'mediaEnd'});
    addMsg("النظام", "تم ارسال الملف للكل");
}

function hideAllMedia(){
    isFileActive = false;
    document.getElementById('upload').disabled = false;
    video.style.display = 'none';
    imageView.style.display = 'none';
    audioView.style.display = 'none';
    pdfView.style.display = 'none';
    txtView.style.display = 'none';
    video.pause();
    audioView.pause();
    pdfView.innerHTML = "";
    txtView.innerHTML = "";
    document.getElementById('prevPage').style.display = 'none';
    document.getElementById('nextPage').style.display = 'none';
}

function renderPdfPage(pageNum){
    pdfDoc.getPage(pageNum).then(function(page){
        let viewport = page.getViewport({scale: 1.5});
        let canvas = document.createElement('canvas');
        let context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        pdfView.innerHTML = "";
        pdfView.appendChild(canvas);
        page.render({canvasContext: context, viewport: viewport});
    });
}

document.getElementById('nextPage').onclick = function(){
    if(pdfDoc && currentPage < pdfDoc.numPages){
        currentPage++;
        renderPdfPage(currentPage);
        broadcast({type: 'docPage', page: currentPage});
    }
}
document.getElementById('prevPage').onclick = function(){
    if(pdfDoc && currentPage > 1){
        currentPage--;
        renderPdfPage(currentPage);
        broadcast({type: 'docPage', page: currentPage});
    }
}

pdfView.onscroll = function(){
    if(canControl() &&!isSyncing) broadcast({type: 'docScroll', scroll: pdfView.scrollTop});
}
txtView.onscroll = function(){
    if(canControl() &&!isSyncing) broadcast({type: 'docScroll', scroll: txtView.scrollTop});
}

function addMsg(name, text){
    let div = document.createElement('div');
    div.className = 'msg';
    if(name == currentAdmin) div.innerHTML = '<b class="admin">👑 ' + name + ':</b> ' + text;
    else div.innerHTML = '<b>' + name + ':</b> ' + text;
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop = 99999;
}

document.getElementById('sendMsg').onclick = function(){
    let text = document.getElementById('msgText').value;
    if(text!= ""){
        addMsg(myName, text);
        broadcast({type: 'chat', name: myName, text: text});
        document.getElementById('msgText').value = '';
    }
}

document.getElementById('beAdmin').onclick = function(){
    broadcast({type: 'requestAdmin', name: myName});
}

document.getElementById('join').onclick = function(){
    let room = document.getElementById('roomId').value;
    myName = room + "-" + Math.floor(Math.random()*1000);
    peer = new Peer(myName, {debug: 2});
    peer.on('open', function(id){
        document.getElementById('status').innerText = "متصل: " + id;
        let hostConn = peer.connect(room, {reliable: true});
        hostConn.on('open', function(){
            hostId = room;
            addConnection(hostConn);
        });
        hostConn.on('error', function(){
            document.getElementById('status').innerText = "تم الاتصال - انت المستضيف";
            hostId = id;
        });
    });
    peer.on('connection', function(c){ if(!hostId) hostId = myName; addConnection(c); });
    peer.on('call', function(call){
        call.answer(inVideo? localVideoStream : localStream);
        if(call.metadata == 'video') videoCalls[call.peer] = call; else voiceCalls[call.peer] = call;
        call.on('stream', function(remoteStream){
            addVideoBox(call.peer, remoteStream, false);
        });
        call.on('close', function(){
            removeVideoBox(call.peer);
            delete videoCalls[call.peer];
            delete voiceCalls[call.peer];
            updateUI();
        });
        updateUI();
    });
}

function addConnection(c){
    connections[c.peer] = c;
    document.getElementById('status').innerText = "تم الاتصال";
    addMsg("النظام", c.peer + " دخل الغرفة");
    updateUI();
    if(inVoice) callUser(c.peer, 'audio');
    if(inVideo) callUser(c.peer, 'video');

    c.on('data', function(data){
        if(data.type == 'mediaStart'){
            mediaChunks = [];
            mediaType = data.type;
            isFileActive = true;
            document.getElementById('upload').disabled = true;
            hideAllMedia();
            if(data.type == 'video') video.style.display = 'block';
            if(data.type == 'audio') audioView.style.display = 'block';
            if(data.type == 'image') imageView.style.display = 'block';
            if(data.type == 'pdf') pdfView.style.display = 'block';
            if(data.type == 'txt') txtView.style.display = 'block';
            addMsg("النظام", "جاري استلام: " + data.name);
        }
        if(data.type == 'mediaChunk'){ mediaChunks.push(data.data); }
        if(data.type == 'mediaEnd'){
            let base64 = mediaChunks.join('');
            if(mediaType == 'video'){ video.src = base64; video.load(); }
            if(mediaType == 'audio'){ audioView.src = base64; audioView.load(); }
            if(mediaType == 'image') imageView.src = base64;
            if(mediaType == 'txt'){ txtView.innerText = atob(base64.split(',')[1]); }
            if(mediaType == 'pdf'){
                let pdfData = atob(base64.split(',')[1]);
                pdfjsLib.getDocument({data: pdfData}).promise.then(function(pdf){
                    pdfDoc = pdf;
                    currentPage = 1;
                    renderPdfPage(currentPage);
                    document.getElementById('prevPage').style.display = 'inline-block';
                    document.getElementById('nextPage').style.display = 'inline-block';
                });
            }
            addMsg("النظام", "تم استلام الملف");
        }
        if(data.type == 'nameChange'){ updateUI(); addMsg("النظام", data.name + " دخل الغرفة"); }
        if(data.type == 'docPage'){ currentPage = data.page; if(mediaType == 'pdf' && pdfDoc) renderPdfPage(currentPage); }
        if(data.type == 'docScroll'){ isSyncing = true; if(mediaType == 'pdf') pdfView.scrollTop = data.scroll; if(mediaType == 'txt') txtView.scrollTop = data.scroll; setTimeout(function(){ isSyncing = false; }, 100); }
        if(data.type == 'emoji'){ showEmoji(data.emoji); }
        if(data.type == 'kick'){ alert("تم طردك من الغرفة"); peer.destroy(); window.location.reload(); }
        if(data.type == 'requestAdmin'){ currentAdmin = data.name; updateUI(); broadcast({type: 'newAdmin', name: data.name}); addMsg("النظام", data.name + " اصبح الادمن الدائم 👑"); }
        if(data.type == 'newAdmin'){ currentAdmin = data.name; updateUI(); }
        if(data.type == 'tempAdmin'){ currentAdmin = myName; updateUI(); addMsg("النظام", "اخذت التحكم لمدة 30 ثانية"); clearTimeout(adminTimer); adminTimer = setTimeout(function(){ currentAdmin = null; updateUI(); addMsg("النظام", "انتهى وقت التحكم"); }, data.duration); }
        if(data.type == 'raiseHand'){ handRaised[data.name] = data.state; updateUI(); if(data.state) addMsg("النظام", data.name + " رفع يدو ✋"); }
        if(mediaType == 'video' || mediaType == 'audio'){
            if(data.type == 'play'){ isSyncing = true; (mediaType=='video'?video:audioView).currentTime = data.time; (mediaType=='video'?video:audioView).play(); setTimeout(function(){ isSyncing = false; }, 200); }
            if(data.type == 'pause'){ isSyncing = true; (mediaType=='video'?video:audioView).currentTime = data.time; (mediaType=='video'?video:audioView).pause(); setTimeout(function(){ isSyncing = false; }, 200); }
            if(data.type == 'seek'){ isSyncing = true; (mediaType=='video'?video:audioView).currentTime = data.time; setTimeout(function(){ isSyncing = false; }, 200); }
        }
        if(data.type == 'chat'){ addMsg(data.name, data.text); }
    });
    c.on('close', function(){
        delete connections[c.peer];
        delete handRaised[c.peer];
        if(voiceCalls[c.peer]){ voiceCalls[c.peer].close(); delete voiceCalls[c.peer]; }
        if(videoCalls[c.peer]){ videoCalls[c.peer].close(); delete videoCalls[c.peer]; }
        removeVideoBox(c.peer);
        addMsg("النظام", c.peer + " طلع");
        updateUI();
    });
}

function broadcast(data){
    for(let id in connections){
        if(connections[id].open) connections[id].send(data);
    }
}

function canControl(){
    return currentAdmin == myName || hostId == myName;
}
function getMedia(){ return mediaType=='video'?video:audioView; }

video.onplay = function(){ if(canControl() &&!isSyncing) broadcast({type: 'play', time: video.currentTime}); }
video.onpause = function(){ if(canControl() &&!isSyncing) broadcast({type: 'pause', time: video.currentTime}); }
video.onseeked = function(){ if(canControl() &&!isSyncing) broadcast({type: 'seek', time: video.currentTime}); }
audioView.onplay = function(){ if(canControl() &&!isSyncing) broadcast({type: 'play', time: audioView.currentTime}); }
audioView.onpause = function(){ if(canControl() &&!isSyncing) broadcast({type: 'pause', time: audioView.currentTime}); }
audioView.onseeked = function(){ if(canControl() &&!isSyncing) broadcast({type: 'seek', time: audioView.currentTime}); }

document.getElementById('play').onclick = function(){ getMedia().play(); }
document.getElementById('pause').onclick = function(){ getMedia().pause(); }
document.getElementById('raiseHand').onclick = function(){
    handRaised[myName] =!handRaised[myName];
    broadcast({type: 'raiseHand', name: myName, state: handRaised[myName]});
    updateUI();
}
function kickUser(id){
    if(connections[id]){
        connections[id].send({type: 'kick'});
        connections[id].close();
        delete connections[id];
        if(voiceCalls[id]){ voiceCalls[id].close(); delete voiceCalls[id]; }
        if(videoCalls[id]){ videoCalls[id].close(); delete videoCalls[id]; }
        removeVideoBox(id);
        addMsg("النظام", id + " تم طردو");
        updateUI();
    }
}
function giveControl(id){
    connections[id].send({type: 'tempAdmin', duration: 30000});
    addMsg("النظام", id + " اخذ التحكم لمدة 30 ثانية");
}

</script>
