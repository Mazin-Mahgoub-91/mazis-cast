<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Mazis Cast Sync V4.6</title>
<style>
body { margin: 0; background: #111; color: #fff; font-family: Arial; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
#topbar { background: #222; padding: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#topbar input { padding: 5px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
#topbar button { padding: 6px 12px; background: #0f0; color: #000; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
#topbar button.tool { background: #555; color: #fff; }
#topbar button.tool.active { background: orange; }
#topbar button.blue { background: #00aaff; color: white; }
#topbar button.red { background: red; color: white; }
#videoGrid { display: flex; flex-wrap: wrap; gap: 5px; padding: 5px; background: #1a1a1a; border-bottom: 2px solid #0f0; max-height: 22vh; }
.video-box { width: 150px; height: 110px; background: #000; border: 2px solid #333; border-radius: 5px; position: relative; }
.video-box video { width: 100%; height: 100%; object-fit: cover; }
.video-box span { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); padding: 2px; font-size: 11px; text-align: center; }
#main { flex: 1; display: flex; overflow: hidden; }
#viewerArea { flex: 1; background: #000; position: relative; overflow: auto; display: flex; align-items: center; justify-content: center; }
#canvas { width: 100%; height: 100%; object-fit: contain; background: #000; }
#imageView { max-width: 100%; max-height: 100%; display: none; }
#audioView { width: 90%; display: none; }
#pdfView { width: 100%; height: 100%; overflow-y: auto; display: none; background: #333; }
#pdfView canvas { display: block; margin: 10px auto; }
#txtView { width: 100%; height: 100%; padding: 20px; background: #222; color: #eee; overflow-y: auto; display: none; white-space: pre-wrap; font-size: 16px; line-height: 1.8; }
#annotationCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }
#viewerArea.annotation #annotationCanvas { pointer-events: auto; }
#chat { width: 280px; background: #1a1a1a; display: flex; flex-direction: column; border-right: 2px solid #0f0; }
#messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 14px; word-wrap: break-word; }
.msg { margin: 5px 0; padding: 6px; background: #333; border-radius: 5px; }
.msg b { color: #0f0; }
.msg.sys { color: #ff0; background: #444; }
#chatInput { display: flex; padding: 10px; gap: 5px; }
#chatInput input { flex: 1; padding: 8px; background: #333; color: #fff; border: 1px solid #555; }
#chatInput button { padding: 8px 12px; background: #0f0; border: none; cursor: pointer; }
#controls { background: #222; padding: 8px; display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
#controls button { padding: 8px 15px; background: #0f0; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
#emojiBar { display: flex; gap: 10px; font-size: 24px; }
#emojiBar span { cursor: pointer; }
.flying-emoji { position: absolute; font-size: 32px; animation: flyUp 3s linear forwards; pointer-events: none; z-index: 20; }
@keyframes flyUp { 0% { bottom: 0; opacity: 1; } 100% { bottom: 100%; opacity: 0; } }
</style>
</head>
<body>

<div id="topbar">
    <label>📁 رفع: <input type="file" id="upload" accept="video/*,audio/*,image/*,.pdf,.txt"></label>
    <input type="text" id="myId" placeholder="اسمك" value="host">
    <input type="text" id="friendId" placeholder="اسم صاحبك">
    <button id="create">انشاء</button>
    <button id="join">دخول</button>
    <button id="voiceBtn">🎤 صوت</button>
    <button id="videoBtn" class="blue">📹 كاميرا</button>
    <button id="toolHighlight" class="tool">🖍️</button>
    <button id="toolDraw" class="tool">✏️</button>
    <button id="toolSelect" class="tool active">👆</button>
    <span id="status" style="color:#ff0">اكتب اسمك</span>
</div>

<div id="videoGrid"></div>

<div id="main">
    <div id="viewerArea">
        <video id="canvas" controls></video>
        <img id="imageView">
        <audio id="audioView" controls></audio>
        <div id="pdfView"></div>
        <div id="txtView"></div>
        <canvas id="annotationCanvas"></canvas>
    </div>
    <div id="chat">
        <div id="messages"></div>
        <div id="chatInput">
            <input type="text" id="msgText" placeholder="اكتب...">
            <button id="sendMsg">ارسال</button>
        </div>
    </div>
</div>

<div id="controls">
    <button id="play">▶️</button>
    <button id="pause">⏸️</button>
    <div id="emojiBar">
        <span onclick="sendEmoji('❤️')">❤️</span><span onclick="sendEmoji('😂')">😂</span>
        <span onclick="sendEmoji('🔥')">🔥</span><span onclick="sendEmoji('👏')">👏</span>
        <span onclick="sendEmoji('😮')">😮</span><span onclick="sendEmoji('💯')">💯</span>
    </div>
    <button id="prevPage" style="display:none;">⬅️</button>
    <button id="nextPage" style="display:none;">➡️</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let video = document.getElementById('canvas');
let imageView = document.getElementById('imageView');
let audioView = document.getElementById('audioView');
let pdfView = document.getElementById('pdfView');
let txtView = document.getElementById('txtView');
let viewerArea = document.getElementById('viewerArea');
let annCanvas = document.getElementById('annotationCanvas');
let annCtx = annCanvas.getContext('2d');

let peer, conn, call;
let myName = "انا";
let isSyncing = false;
let isHost = false;
let localStream = null;
let localVideoStream = null;
let mediaType = "";
let mediaChunks = [];
let mediaMime = "";
let pdfDoc = null;
let currentPage = 1;
let tool = 'select';
let annotations = [];
let isDrawing = false;

// === الادوات ===
document.getElementById('toolHighlight').onclick = ()=> setTool('highlight');
document.getElementById('toolDraw').onclick = ()=> setTool('draw');
document.getElementById('toolSelect').onclick = ()=> setTool('select');
function setTool(t){ tool=t; document.querySelectorAll('.tool').forEach(b=>b.classList.remove('active')); document.getElementById('tool'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active'); viewerArea.className = t=='select'? '' : 'annotation'; }

// === الكاميرا والصوت ===
document.getElementById('voiceBtn').onclick = async function(){
    if(!localStream){ localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); document.getElementById('voiceBtn').className="red"; if(conn) call = peer.call(conn.peer, localStream); addSysMsg("دخلت الصوت 🎤"); }
    else { localStream.getTracks().forEach(t=>t.stop()); localStream=null; document.getElementById('voiceBtn').className=""; if(call) call.close(); addSysMsg("طلعت من الصوت"); }
}
document.getElementById('videoBtn').onclick = async function(){
    if(!localVideoStream){ localVideoStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true }); document.getElementById('videoBtn').className="red"; addVideoBox(myName, localVideoStream, true); if(conn) call = peer.call(conn.peer, localVideoStream); addSysMsg("شغلت الكاميرا 📹"); }
    else { localVideoStream.getTracks().forEach(t=>t.stop()); localVideoStream=null; document.getElementById('videoBtn').className="blue"; if(call) call.close(); removeVideoBox(myName); addSysMsg("قفلت الكاميرا"); }
}
function addVideoBox(id, stream, isMe){ removeVideoBox(id); let box=document.createElement('div'); box.id='vid-'+id; box.className='video-box'; let v=document.createElement('video'); v.srcObject=stream; v.autoplay=true; v.muted=isMe; box.appendChild(v); let span=document.createElement('span'); span.innerText=id+(isMe?' انت':''); box.appendChild(span); document.getElementById('videoGrid').appendChild(box); }
function removeVideoBox(id){ let b=document.getElementById('vid-'+id); if(b) b.remove(); }

// === الايموجي ===
function sendEmoji(emoji){ if(conn) send({type:'emoji', emoji:emoji}); showEmoji(emoji); }
function showEmoji(emoji){ let el=document.createElement('div'); el.className='flying-emoji'; el.innerText=emoji; el.style.left=Math.random()*80+10+'%'; viewerArea.appendChild(el); setTimeout(()=>el.remove(),3000); }

// === رفع الملف - رجوع لطريقة V4 ===
document.getElementById('upload').onchange = function(e){
    let file = e.target.files[0]; if(!file) return;
    addSysMsg("تم رفع: " + file.name);
    hideAllMedia();
    mediaMime = file.type;

    if(file.type.startsWith('video/')){ mediaType='video'; video.style.display='block'; }
    else if(file.type.startsWith('audio/')){ mediaType='audio'; audioView.style.display='block'; }
    else if(file.type.startsWith('image/')){ mediaType='image'; imageView.style.display='block'; }
    else if(file.type=='application/pdf'){ mediaType='pdf'; pdfView.style.display='block'; }
    else { mediaType='txt'; txtView.style.display='block'; }

    let reader = new FileReader(); // نفس V4
    reader.onload = function(evt){
        let base64 = evt.target.result;

        // 1. شغل محلي اول
        loadLocal(base64);
        addSysMsg("تم التحميل محلي ✓");

        // 2. لو في اتصال رسل
        if(conn){
            addSysMsg("برسل الملف...");
            send({type:'mediaStart', typeFile:mediaType, name:file.name, mime:mediaMime});
            sendInChunks(base64); // نفس V4
            send({type:'mediaEnd'});
            addSysMsg("تم الارسال كامل ✓");
        }
    }

    if(mediaType == 'pdf'){ reader.readAsArrayBuffer(file); } // pdf لحالو
    else{ reader.readAsDataURL(file); } // الباقي كلو dataurl
}

function loadLocal(base64){
    if(mediaType=='video'){ video.src=base64; video.load(); }
    if(mediaType=='audio'){ audioView.src=base64; audioView.load(); }
    if(mediaType=='image'){ imageView.src=base64; setTimeout(resizeCanvas,100); }
    if(mediaType=='txt'){ txtView.innerText=atob(base64.split(',')[1]); }
    if(mediaType=='pdf'){
        pdfjsLib.getDocument({data:base64}).promise.then(pdf=>{ pdfDoc=pdf; currentPage=1; renderPdfPage(1); document.getElementById('prevPage').style.display='inline'; document.getElementById('nextPage').style.display='inline'; });
    }
}

function sendInChunks(base64){ const chunkSize=16000; for(let i=0;i<base64.length;i+=chunkSize){ send({type:'mediaChunk', data:base64.slice(i,[STRIPPED] } }

function hideAllMedia(){ video.pause(); audioView.pause(); video.src=""; audioView.src=""; video.style.display='none'; imageView.style.display='none'; audioView.style.display='none'; pdfView.style.display='none'; txtView.style.display='none'; document.getElementById('prevPage').style.display='none'; document.getElementById('nextPage').style.display='none'; annotations=[]; redrawAnnotations(); }

function renderPdfPage(p){
    pdfDoc.getPage(p).then(page=>{
        let v=page.getViewport({scale:1.5});
        annCanvas.width=v.width; annCanvas.height=v.height;
        let c=document.createElement('canvas'); c.width=v.width; c.height=v.height;
        pdfView.innerHTML=""; pdfView.appendChild(c);
        page.render({canvasContext:c.getContext('2d'), viewport:v}).promise.then(redrawAnnotations);
    });
}
document.getElementById('nextPage').onclick=()=>{ if(pdfDoc && currentPage<pdfDoc.numPages){ currentPage++; renderPdfPage(currentPage); if(conn) send({type:'docPage', page:currentPage}); } }
document.getElementById('prevPage').onclick=()=>{ if(pdfDoc && currentPage>1){ currentPage--; renderPdfPage(currentPage); if(conn) send({type:'docPage', page:currentPage}); } }

// === مزامنة السكرول ===
viewerArea.onscroll=()=>{ if(!isSyncing && conn && (mediaType=='pdf'||mediaType=='txt')) send({type:'docScroll', scroll:viewerArea.scrollTop}); }

// === القلم والتظليل ===
function resizeCanvas(){ if(mediaType=='image'){ annCanvas.width=imageView.clientWidth; annCanvas.height=imageView.clientHeight; annCanvas.style.left=imageView.offsetLeft+'px'; annCanvas.style.top=imageView.offsetTop+'px'; } }
window.onresize=resizeCanvas;

annCanvas.onmousedown=(e)=>{ if(tool=='draw'){ isDrawing=true; annotations.push({type:'draw', points:[], color:'red', page:currentPage}); } if(tool=='highlight'){ let rect=annCanvas.getBoundingClientRect(); annotations.push({type:'highlight', x:e.clientX-rect.left, y:e.clientY-rect.top, w:100, h:20, page:currentPage}); } }
annCanvas.onmousemove=(e)=>{ if(isDrawing){ let rect=annCanvas.getBoundingClientRect(); annotations[annotations.length-1].points.push({x:e.clientX-rect.left, y:e.clientY-rect.top}); redrawAnnotations(); } }
annCanvas.onmouseup=()=>{ if(isDrawing){ isDrawing=false; if(conn) send({type:'annotation', data:annotations[annotations.length-1]}); } }

function redrawAnnotations(){
    annCtx.clearRect(0,0,annCanvas.width,annCanvas.height);
    annotations.filter(a=>a.page==currentPage).forEach(a=>{
        if(a.type=='draw'){ annCtx.strokeStyle=a.color; annCtx.lineWidth=3; annCtx.beginPath(); a.points.forEach((p,i)=>{ i==0?annCtx.moveTo(p.x,p.y):annCtx.lineTo(p.x,p.y); }); annCtx.stroke(); }
        if(a.type=='highlight'){ annCtx.fillStyle='rgba(255,255,0,0.4)'; annCtx.fillRect(a.x,a.y,a.w,a.h); }
    });
}

// === الشات ===
function addMsg(name,text){ let div=document.createElement('div'); div.className='msg'; div.innerHTML="<b>"+name+":</b> "+text; document.getElementById('messages').appendChild(div); document.getElementById('messages').scrollTop=99999; }
function addSysMsg(text){ let div=document.createElement('div'); div.className='msg sys'; div.innerHTML="<b>النظام:</b> "+text; document.getElementById('messages').appendChild(div); document.getElementById('messages').scrollTop=99999; }
document.getElementById('sendMsg').onclick=()=>{ let text=document.getElementById('msgText').value; if(text){ addMsg(myName,text); if(conn) send({type:'chat',name:myName,text:text}); document.getElementById('msgText').value=''; } }

// === الاتصال ===
document.getElementById('create').onclick=()=>{ myName=document.getElementById('myId').value; peer=new Peer(myName); peer.on('open',id=>{document.getElementById('status').innerText="الغرفة: "+id;}); peer.on('connection',c=>{conn=c; isHost=true; setupConn();}); peer.on('call',c=>{c.answer(localVideoStream||localStream); c.on('stream',s=>addVideoBox(c.peer,s,false));}); }
document.getElementById('join').onclick=()=>{ myName=document.getElementById('myId').value; let friend=document.getElementById('friendId').value; peer=new Peer(myName+"-guest"); peer.on('open',()=>{conn=peer.connect(friend); setupConn();}); peer.on('call',c=>{c.answer(localVideoStream||localStream); c.on('stream',s=>addVideoBox(c.peer,s,false));}); }

function setupConn(){
    conn.on('open',()=>{document.getElementById('status').innerText="متصل"; addSysMsg("تم الاتصال مع "+conn.peer);});
    conn.on('data',data=>{
        isSyncing=true;
        if(data.type=='mediaStart'){ mediaChunks=[]; mediaType=data.typeFile; mediaMime=data.mime; hideAllMedia(); if(mediaType=='video')video.style.display='block'; if(mediaType=='audio')audioView.style.display='block'; if(mediaType=='image')imageView.style.display='block'; if(mediaType=='pdf')pdfView.style.display='block'; if(mediaType=='txt')txtView.style.display='block'; addSysMsg("جاري استلام: "+data.name); }
        if(data.type=='mediaChunk'){ mediaChunks.push(data.data); }
        if(data.type=='mediaEnd'){
            let base64=mediaChunks.join('');
            loadLocal(base64); // نفس فانكشن التشغيل المحلي
            addSysMsg("تم الاستلام كامل ✓");
        }
        if(data.type=='docScroll'){viewerArea.scrollTop=data.scroll;}
        if(data.type=='docPage'){currentPage=data.page; if(mediaType=='pdf')renderPdfPage(currentPage);}
        if(data.type=='annotation'){annotations.push(data.data); redrawAnnotations();}
        if(data.type=='chat'){addMsg(data.name,data.text);}
        if(data.type=='emoji'){showEmoji(data.emoji);}
        if(data.type=='play'){(mediaType=='video'?video:audioView).currentTime=data.time; (mediaType=='video'?video:audioView).play();}
        if(data.type=='pause'){(mediaType=='video'?video:audioView).currentTime=data.time; (mediaType=='video'?video:audioView).pause();}
        if(data.type=='seek'){(mediaType=='video'?video:audioView).currentTime=data.time;}
        setTimeout(()=>{isSyncing=false;},100);
    });
}

function send(data){ if(conn) conn.send(data); }

// مزامنة الفيديو والصوت
video.onplay=()=>{if(isHost && conn) send({type:'play',time:video.currentTime});}
video.onpause=()=>{if(isHost && conn) send({type:'pause',time:video.currentTime});}
video.onseeked=()=>{if(isHost && conn) send({type:'seek',time:video.currentTime});}
audioView.onplay=()=>{if(isHost && conn) send({type:'play',time:audioView.currentTime});}
audioView.onpause=()=>{if(isHost && conn) send({type:'pause',time:audioView.currentTime});}
audioView.onseeked=()=>{if(isHost && conn) send({type:'seek',time:audioView.currentTime});}
document.getElementById('play').onclick=()=>(mediaType=='video'?video:audioView).play();
document.getElementById('pause').onclick=()=>(mediaType=='video'?video:audioView).pause();

</script>
</body>
</html>
