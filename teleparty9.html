<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teleparty App</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #111; color: #fff; font-family: Arial; display: flex; flex-direction: column; min-height: 100vh; }
#topbar { background: #222; padding: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; }
#appName { font-size: 13px; font-weight: bold; color: #0f0; margin-left: 5px; border-left: 2px solid #0f0; padding-left: 8px; }
#topbar input[type="text"] { padding: 6px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
#topbar input[type="file"] { display: none; }
#topbar label.uploadBtn { padding: 6px 12px; color: #fff; cursor: pointer; border-radius: 5px; font-weight: bold; }
#topbar button { padding: 6px 12px; background: #0f0; color: #000; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
#topbar button.tool { background: #555; color: #fff; }
#topbar button.tool.active { background: orange; color: #000; }
#topbar button.blue { background: #00aaff; color: white; }
#topbar button.red { background: red; color: white; }
#videoGrid { display: flex; flex-wrap: wrap; gap: 5px; padding: 5px; background: #1a1a1a; border-bottom: 2px solid #0f0; }
.video-box { width: 150px; height: 110px; background: #000; border: 2px solid #333; border-radius: 5px; position: relative; overflow: hidden; }
.video-box video { width: 100%; height: 100%; object-fit: cover; }
.video-box span { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); padding: 2px; font-size: 11px; text-align: center; }
#main { flex: 1; display: flex; overflow: hidden; min-height: 0; }
#viewerArea { flex: 1; background: #000; position: relative; overflow: auto; display: flex; align-items: center; justify-content: center; }
#canvas { width: 100%; height: 100%; object-fit: contain; background: #000; display: none; }
#imageView { max-width: 100%; max-height: 100%; display: none; }
#audioView { width: 90%; display: none; }
#pdfView { width: 100%; height: 100%; overflow-y: auto; display: none; background: #333; }
#pdfView canvas { display: block; margin: 10px auto; max-width: 100%; }
#txtView { width: 100%; height: 100%; padding: 20px; background: #222; color: #eee; overflow-y: auto; display: none; white-space: pre-wrap; line-height: 1.8; }
#annotationCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
#viewerArea.annotation #annotationCanvas { pointer-events: auto; cursor: crosshair; }
#chat { width: 300px; background: #1a1a1a; display: flex; flex-direction: column; border-right: 2px solid #0f0; flex-shrink: 0; }
#messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 14px; }
.msg { margin: 5px 0; padding: 6px; background: #333; border-radius: 5px; word-break: break-word; }
.msg b { color: #0f0; }
.msg.sys { color: #ff0; background: #444; }
#chatInput { display: flex; padding: 10px; gap: 5px; }
#chatInput input { flex: 1; min-width: 0; padding: 8px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
#chatInput button { padding: 8px 12px; background: #0f0; color: #000; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
#controls { background: #222; padding: 8px; display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
#controls button { padding: 8px 15px; background: #0f0; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
#emojiBar { display: flex; gap: 10px; font-size: 24px; }
#emojiBar span { cursor: pointer; }
.flying-emoji { position: absolute; font-size: 32px; animation: flyUp 3s linear forwards; pointer-events: none; z-index: 20; }
@keyframes flyUp { 0% { bottom: 0; opacity: 1; } 100% { bottom: 100%; opacity: 0; } }

@media (max-width: 768px) {
  body { display: block; overflow-y: auto; height: auto; min-height: 100dvh; }
  #topbar { position: relative; }
  #main { display: block; overflow: visible; }
  #viewerArea { min-height: 300px; height: 50vh; width: 100%; }
  #chat { width: 100%; min-height: 350px; border-right: none; border-top: 3px solid #0f0; }
  #controls { position: relative; }
}
</style>
</head>
<body>

<div id="topbar">
    <div id="appName">Teleparty App</div>
    <label for="uploadMedia" class="uploadBtn" style="background:#00aaff;">رفع فيديو / صوت</label>
    <input type="file" id="uploadMedia" accept="video/*,audio/*">
    <label for="uploadDoc" class="uploadBtn" style="background:#ff8800;">رفع PDF / TXT</label>
    <input type="file" id="uploadDoc" accept=".pdf,.txt">
    <label for="uploadImage" class="uploadBtn" style="background:#aa00ff;">رفع صور</label>
    <input type="file" id="uploadImage" accept="image/*">
    <input type="text" id="myId" placeholder="اكتب اسمك هنا" value="host">
    <input type="text" id="friendId" placeholder="اكتب اسم صاحبك هنا">
    <button id="create">انشاء غرفة</button>
    <button id="join">دخول غرفة</button>
    <button id="voiceBtn">تشغيل الصوت</button>
    <button id="videoBtn" class="blue">تشغيل الكاميرا</button>
    <button id="toolHighlight" class="tool">قلم تظليل</button>
    <button id="toolDraw" class="tool">قلم شخبطة</button>
    <button id="toolSelect" class="tool active">مؤشر</button>
    <span id="status" style="color:#ff0">جاهز</span>
</div>

<div id="videoGrid"></div>

<div id="main">
    <div id="viewerArea">
        <video id="canvas" controls playsinline></video>
        <img id="imageView">
        <audio id="audioView" controls></audio>
        <div id="pdfView"></div>
        <div id="txtView"></div>
        <canvas id="annotationCanvas"></canvas>
    </div>
    <div id="chat">
        <div id="messages"></div>
        <div id="chatInput">
            <input type="text" id="msgText" placeholder="اكتب رسالتك هنا...">
            <button id="sendMsg">ارسال</button>
        </div>
    </div>
</div>

<div id="controls">
    <button id="play">تشغيل</button>
    <button id="pause">ايقاف</button>
    <div id="emojiBar">
        <span onclick="sendEmoji('❤️')">❤️</span><span onclick="sendEmoji('😂')">😂</span>
        <span onclick="sendEmoji('🔥')">🔥</span><span onclick="sendEmoji('👏')">👏</span>
        <span onclick="sendEmoji('😮')">😮</span><span onclick="sendEmoji('💯')">💯</span>
    </div>
    <button id="prevPage" style="display:none;">الصفحة السابقة</button>
    <button id="nextPage" style="display:none;">الصفحة التالية</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let video = document.getElementById('canvas');
let imageView = document.getElementById('imageView');
let audioView = document.getElementById('audioView');
let pdfView = document.getElementById('pdfView');
let txtView = document.getElementById('txtView');
let viewerArea = document.getElementById('viewerArea');
let annCanvas = document.getElementById('annotationCanvas');
let annCtx = annCanvas.getContext('2d');

let peer, conn, call;
let myName = "انا";
let isSyncing = false;
let isHost = false;
let localStream = null;
let localVideoStream = null;
let mediaType = "";
let mediaChunks = [];
let mediaMime = "";
let pdfDoc = null;
let currentPage = 1;
let tool = 'select';
let annotations = [];
let isDrawing = false;
let localObjectURL = null;

// === الاقلام رجعت ===
document.getElementById('toolHighlight').onclick = ()=> setTool('highlight');
document.getElementById('toolDraw').onclick = ()=> setTool('draw');
document.getElementById('toolSelect').onclick = ()=> setTool('select');
function setTool(t){
    tool=t;
    document.querySelectorAll('.tool').forEach(b=>b.classList.remove('active'));
    document.getElementById('tool'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');
    viewerArea.className = t=='select'? '' : 'annotation';
}

document.getElementById('voiceBtn').onclick = async function(){
    if(!localStream){ localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); document.getElementById('voiceBtn').className="red"; document.getElementById('voiceBtn').innerText="ايقاف الصوت"; if(conn) call = peer.call(conn.peer, localStream); addSysMsg("دخلت الصوت"); }
    else { localStream.getTracks().forEach(t=>t.stop()); localStream=null; document.getElementById('voiceBtn').className=""; document.getElementById('voiceBtn').innerText="تشغيل الصوت"; if(call) call.close(); }
}
document.getElementById('videoBtn').onclick = async function(){
    if(!localVideoStream){ localVideoStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true }); document.getElementById('videoBtn').className="red"; document.getElementById('videoBtn').innerText="ايقاف الكاميرا"; addVideoBox(myName, localVideoStream, true); if(conn) call = peer.call(conn.peer, localVideoStream); }
    else { localVideoStream.getTracks().forEach(t=>t.stop()); localVideoStream=null; document.getElementById('videoBtn').className="blue"; document.getElementById('videoBtn').innerText="تشغيل الكاميرا"; if(call) call.close(); removeVideoBox(myName); }
}
function addVideoBox(id, stream, isMe){ removeVideoBox(id); let box=document.createElement('div'); box.id='vid-'+id; box.className='video-box'; let v=document.createElement('video'); v.srcObject=stream; v.autoplay=true; v.muted=isMe; v.playsInline=true; box.appendChild(v); let span=document.createElement('span'); span.innerText=id; box.appendChild(span); document.getElementById('videoGrid').appendChild(box); }
function removeVideoBox(id){ let b=document.getElementById('vid-'+id); if(b) b.remove(); }

function sendEmoji(emoji){ if(conn) send({type:'emoji', emoji:emoji}); showEmoji(emoji); }
function showEmoji(emoji){ let el=document.createElement('div'); el.className='flying-emoji'; el.innerText=emoji; el.style.left=Math.random()*80+10+'%'; viewerArea.appendChild(el); setTimeout(()=>el.remove(),3000); }

function hideAllMedia(){
    video.pause(); audioView.pause();
    video.style.display='none'; imageView.style.display='none'; audioView.style.display='none'; pdfView.style.display='none'; txtView.style.display='none';
    document.getElementById('prevPage').style.display='none'; document.getElementById('nextPage').style.display='none';
    annotations=[]; redrawAnnotations();
}

function sendInChunks(b64){ const s=16000; for(let i=0;i<b64.length;i+=s) send({type:'mediaChunk', data:b64.slice(i, i+s)}); }

// === حل مشكلة اللابتوب: Blob بزمن مريح ===
function playLocalWithDelay(file, type){
    hideAllMedia();
    mediaType = type;
    mediaMime = file.type;

    if(localObjectURL){ try{ URL.revokeObjectURL(localObjectURL); }catch(e){} }

    // 1. نشغل محلي اول بـ Blob
    localObjectURL = URL.createObjectURL(file);
    if(type=='video'){
        video.style.display='block';
        video.src = localObjectURL;
        // نديهو مهلة كافية يقرا الهيدر
        video.onloadedmetadata = function(){
            addSysMsg("الفيديو جاهز: " + Math.floor(video.duration) + " ثانية");
            // 2. بعد ما يجهز نبدأ نرسل لو في غرفة
            if(conn){
                setTimeout(()=>{ // مهلة اضافية 500ms
                    let reader = new FileReader();
                    reader.onload = (ev)=>{
                        addSysMsg("برسل الملف...");
                        send({type:'mediaStart', typeFile:type, name:file.name, mime:file.type});
                        sendInChunks(ev.target.result);
                        send({type:'mediaEnd'});
                        addSysMsg("تم الارسال");
                    };
                    reader.readAsDataURL(file);
                }, 500);
            }
        };
        video.onerror = function(){ addSysMsg("فشل تشغيل الفيديو - جرب ملف تاني"); };
    } else if(type=='audio'){
        audioView.style.display='block';
        audioView.src = localObjectURL;
        addSysMsg("تم تحميل الصوت: " + file.name);
        if(conn){
            setTimeout(()=>{
                let reader = new FileReader();
                reader.onload=(ev)=>{ send({type:'mediaStart', typeFile:'audio', name:file.name, mime:file.type}); sendInChunks(ev.target.result); send({type:'mediaEnd'}); };
                reader.readAsDataURL(file);
            }, 500);
        }
    } else if(type=='image'){
        imageView.style.display='block';
        imageView.src = localObjectURL;
        setTimeout(resizeCanvas, 300);
        addSysMsg("تم تحميل الصورة: " + file.name);
        if(conn){
            let reader = new FileReader();
            reader.onload=(ev)=>{ send({type:'mediaStart', typeFile:'image', name:file.name, mime:file.type}); sendInChunks(ev.target.result); send({type:'mediaEnd'}); };
            reader.readAsDataURL(file);
        }
    }
}

document.getElementById('uploadMedia').onchange = function(e){ let file=e.target.files[0]; if(!file) return; let type=file.type.startsWith('video/')?'video':'audio'; playLocalWithDelay(file, type); }
document.getElementById('uploadImage').onchange = function(e){ let file=e.target.files[0]; if(!file) return; playLocalWithDelay(file, 'image'); }

document.getElementById('uploadDoc').onchange = function(e){
    let file = e.target.files[0]; if(!file) return;
    hideAllMedia();
    mediaType = file.type == 'application/pdf'? 'pdf' : 'txt';
    mediaMime = file.type;
    if(mediaType=='pdf') pdfView.style.display='block'; else txtView.style.display='block';
    let reader = new FileReader();
    reader.onload = function(ev){
        let data = ev.target.result;
        if(mediaType=='txt'){ try{ txtView.innerText=atob(data.split(',')[1]); }catch(e){ txtView.innerText=data; } }
        if(mediaType=='pdf'){ pdfjsLib.getDocument({data:data}).promise.then(pdf=>{ pdfDoc=pdf; currentPage=1; renderPdfPage(1); document.getElementById('prevPage').style.display='inline'; document.getElementById('nextPage').style.display='inline'; }); }
        addSysMsg("تم التحميل: " + file.name);
        if(conn){
            if(data instanceof ArrayBuffer){
                let blob=new Blob([data]); let r2=new FileReader(); r2.onload=(e2)=>{ send({type:'mediaStart', typeFile:mediaType, name:file.name, mime:file.type}); sendInChunks(e2.target.result); send({type:'mediaEnd'}); }; r2.readAsDataURL(blob);
            } else { send({type:'mediaStart', typeFile:mediaType, name:file.name, mime:file.type}); sendInChunks(data); send({type:'mediaEnd'}); }
        }
    };
    if(mediaType=='pdf') reader.readAsArrayBuffer(file); else reader.readAsDataURL(file);
}

function renderPdfPage(p){
    pdfDoc.getPage(p).then(page=>{
        let v=page.getViewport({scale:1.5});
        annCanvas.width=v.width; annCanvas.height=v.height;
        let c=document.createElement('canvas'); c.width=v.width; c.height=v.height;
        pdfView.innerHTML=""; pdfView.appendChild(c);
        page.render({canvasContext:c.getContext('2d'), viewport:v}).promise.then(redrawAnnotations);
    });
}
document.getElementById('nextPage').onclick=()=>{ if(pdfDoc && currentPage<pdfDoc.numPages){ currentPage++; renderPdfPage(currentPage); if(conn) send({type:'docPage', page:currentPage}); } }
document.getElementById('prevPage').onclick=()=>{ if(pdfDoc && currentPage>1){ currentPage--; renderPdfPage(currentPage); if(conn) send({type:'docPage', page:currentPage}); } }
viewerArea.onscroll=()=>{ if(!isSyncing && conn && (mediaType=='pdf'||mediaType=='txt')) send({type:'docScroll', scroll:viewerArea.scrollTop}); }

// === تظليل وشخبطة متزامن ===
function resizeCanvas(){
    if(imageView.style.display!='none'){ annCanvas.width=imageView.clientWidth; annCanvas.height=imageView.clientHeight; annCanvas.style.left=imageView.offsetLeft+'px'; annCanvas.style.top=imageView.offsetTop+'px'; }
    else { annCanvas.width=viewerArea.clientWidth; annCanvas.height=viewerArea.clientHeight; annCanvas.style.left='0px'; annCanvas.style.top='0px'; }
}
window.onresize=resizeCanvas;

let startX, startY;
annCanvas.onmousedown=(e)=>{
    let rect=annCanvas.getBoundingClientRect();
    let x=e.clientX-rect.left, y=e.clientY-rect.top;
    if(tool=='draw'){ isDrawing=true; annotations.push({type:'draw', points:[{x,y}], color:'red', page:currentPage}); startX=x; startY=y; }
    if(tool=='highlight'){ let ann={type:'highlight', x:x, y:y, w:120, h:25, page:currentPage}; annotations.push(ann); redrawAnnotations(); if(conn) send({type:'annotation', data:ann}); }
}
annCanvas.onmousemove=(e)=>{
    if(isDrawing && tool=='draw'){
        let rect=annCanvas.getBoundingClientRect();
        let x=e.clientX-rect.left, y=e.clientY-rect.top;
        annotations[annotations.length-1].points.push({x,y});
        redrawAnnotations();
    }
}
annCanvas.onmouseup=()=>{
    if(isDrawing){ isDrawing=false; if(conn) send({type:'annotation', data:annotations[annotations.length-1]}); }
}
annCanvas.ontouchstart=(e)=>{ e.preventDefault(); let t=e.touches[0]; annCanvas.onmousedown({clientX:t.clientX, clientY:t.clientY}); }
annCanvas.ontouchmove=(e)=>{ e.preventDefault(); let t=e.touches[0]; annCanvas.onmousemove({clientX:t.clientX, clientY:t.clientY}); }
annCanvas.ontouchend=()=>{ annCanvas.onmouseup(); }

function redrawAnnotations(){
    annCtx.clearRect(0,0,annCanvas.width,annCanvas.height);
    annotations.filter(a=>a.page==currentPage).forEach(a=>{
        if(a.type=='draw'){ annCtx.strokeStyle=a.color; annCtx.lineWidth=3; annCtx.lineJoin='round'; annCtx.beginPath(); a.points.forEach((p,i)=>{ i==0?annCtx.moveTo(p.x,p.y):annCtx.lineTo(p.x,p.y); }); annCtx.stroke(); }
        if(a.type=='highlight'){ annCtx.fillStyle='rgba(255,255,0,0.4)'; annCtx.fillRect(a.x,a.y,a.w,a.h); }
    });
}

// شات
function addMsg(name,text){ let div=document.createElement('div'); div.className='msg'; div.innerHTML="<b>"+name+":</b> "+text; document.getElementById('messages').appendChild(div); document.getElementById('messages').scrollTop=99999; }
function addSysMsg(text){ let div=document.createElement('div'); div.className='msg sys'; div.innerHTML="<b>النظام:</b> "+text; document.getElementById('messages').appendChild(div); document.getElementById('messages').scrollTop=99999; }
document.getElementById('sendMsg').onclick=()=>{ let text=document.getElementById('msgText').value; if(text){ addMsg(myName,text); if(conn) send({type:'chat',name:myName,text:text}); document.getElementById('msgText').value=''; } }
document.getElementById('msgText').onkeypress=(e)=>{ if(e.key=='Enter') document.getElementById('sendMsg').click(); }

// اتصال
document.getElementById('create').onclick=()=>{ myName=document.getElementById('myId').value; peer=new Peer(myName); peer.on('open',id=>{document.getElementById('status').innerText="الغرفة: "+id;}); peer.on('connection',c=>{conn=c; isHost=true; setupConn();}); peer.on('call',c=>{c.answer(localVideoStream||localStream); c.on('stream',s=>addVideoBox(c.peer,s,false));}); }
document.getElementById('join').onclick=()=>{ myName=document.getElementById('myId').value; let friend=document.getElementById('friendId').value; peer=new Peer(myName+"-guest"); peer.on('open',()=>{conn=peer.connect(friend); setupConn();}); peer.on('call',c=>{c.answer(localVideoStream||localStream); c.on('stream',s=>addVideoBox(c.peer,s,false));}); }

function setupConn(){
    conn.on('open',()=>{document.getElementById('status').innerText="متصل"; addSysMsg("تم الاتصال مع "+conn.peer);});
    conn.on('data',data=>{
        isSyncing=true;
        if(data.type=='mediaStart'){ mediaChunks=[]; mediaType=data.typeFile; mediaMime=data.mime; hideAllMedia(); if(mediaType=='video')video.style.display='block'; if(mediaType=='audio')audioView.style.display='block'; if(mediaType=='image')imageView.style.display='block'; if(mediaType=='pdf')pdfView.style.display='block'; if(mediaType=='txt')txtView.style.display='block'; addSysMsg("جاري استلام: "+data.name); }
        if(data.type=='mediaChunk'){ mediaChunks.push(data.data); }
        if(data.type=='mediaEnd'){
            let base64=mediaChunks.join('');
            if(mediaType=='video'||mediaType=='audio'||mediaType=='image'){
                if(mediaType=='video'){ video.src=base64; video.load(); }
                if(mediaType=='audio'){ audioView.src=base64; audioView.load(); }
                if(mediaType=='image'){ imageView.src=base64; setTimeout(resizeCanvas,100); }
            } else {
                if(mediaType=='txt'){ try{ txtView.innerText=atob(base64.split(',')[1]); }catch(e){ txtView.innerText=base64; } }
                if(mediaType=='pdf'){ try{ let bin=atob(base64.split(',')[1]); let arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); pdfjsLib.getDocument({data:arr}).promise.then(pdf=>{ pdfDoc=pdf; currentPage=1; renderPdfPage(1); document.getElementById('prevPage').style.display='inline'; document.getElementById('nextPage').style.display='inline'; }); }catch(e){} }
            }
            addSysMsg("تم الاستلام كامل");
        }
        if(data.type=='docScroll'){viewerArea.scrollTop=data.scroll;}
        if(data.type=='docPage'){currentPage=data.page; if(mediaType=='pdf')renderPdfPage(currentPage);}
        if(data.type=='annotation'){annotations.push(data.data); redrawAnnotations();}
        if(data.type=='chat'){addMsg(data.name,data.text);}
        if(data.type=='emoji'){showEmoji(data.emoji);}
        if(data.type=='play'){(mediaType=='video'?video:audioView).currentTime=data.time; (mediaType=='video'?video:audioView).play();}
        if(data.type=='pause'){(mediaType=='video'?video:audioView).currentTime=data.time; (mediaType=='video'?video:audioView).pause();}
        if(data.type=='seek'){(mediaType=='video'?video:audioView).currentTime=data.time;}
        setTimeout(()=>{isSyncing=false;},100);
    });
}
function send(data){ if(conn) conn.send(data); }

video.onplay=()=>{if(isHost && conn) send({type:'play',time:video.currentTime});}
video.onpause=()=>{if(isHost && conn) send({type:'pause',time:video.currentTime});}
video.onseeked=()=>{if(isHost && conn) send({type:'seek',time:video.currentTime});}
audioView.onplay=()=>{if(isHost && conn) send({type:'play',time:audioView.currentTime});}
audioView.onpause=()=>{if(isHost && conn) send({type:'pause',time:audioView.currentTime});}
document.getElementById('play').onclick=()=>(mediaType=='video'?video:audioView).play();
document.getElementById('pause').onclick=()=>(mediaType=='video'?video:audioView).pause();
</script>
</body>
</html>
