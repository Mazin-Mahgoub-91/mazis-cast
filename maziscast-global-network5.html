<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Mazis Cast Room V3.3</title>
<style>
body { margin: 0; background: #111; color: #fff; font-family: Arial; display: flex; flex-direction: column; height: 100vh; }
#topbar { background: #222; padding: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#topbar input { padding: 5px; background: #333; color: #fff; border: 1px solid #555; }
#topbar button { padding: 5px 15px; background: #0f0; color: #000; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
#topbar button.orange { background: orange; }
#topbar button.blue { background: #00aaff; }
#main { flex: 1; display: flex; overflow: hidden; }
#videoArea { flex: 1; background: #000; }
#canvas { width: 100%; height: 100%; object-fit: contain; background: #000; }
#chat { width: 280px; background: #1a1a1a; display: flex; flex-direction: column; border-right: 2px solid #0f0; }
#messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 14px; }
.msg { margin: 5px 0; padding: 6px; background: #333; border-radius: 5px; }
.msg b { color: #0f0; }
.msg.admin { color: #ff0; }
#chatInput { display: flex; padding: 10px; gap: 5px; }
#chatInput input { flex: 1; padding: 8px; background: #333; color: #fff; border: 1px solid #555; }
#chatInput button { padding: 8px 12px; background: #0f0; border: none; cursor: pointer; }
#controls { background: #222; padding: 10px; display: flex; gap: 10px; justify-content: center; }
#controls button { padding: 10px 20px; background: #0f0; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
#users { background: #1a1a1a; padding: 5px; text-align: center; border-bottom: 1px solid #333; display: flex; flex-direction: column; max-height: 120px; overflow-y: auto; }
.user-item { display: flex; justify-content: space-between; padding: 3px 10px; }
.kick-btn { background: red; color: white; border: none; padding: 2px 8px; cursor: pointer; border-radius: 3px; font-size: 12px; }
.raise-btn { background: orange; color: white; border: none; padding: 2px 8px; cursor: pointer; border-radius: 3px; font-size: 12px; }
</style>
</head>
<body>

<div id="topbar">
    <label>📁 فيديو: <input type="file" id="upload" accept="video/*"></label>
    <input type="text" id="roomId" placeholder="كود الغرفة" value="mazis-room">
    <button id="join">دخول الغرفة</button>
    <button id="beAdmin" class="orange">👑 كن الادمن</button>
    <button id="raiseHand" class="blue">✋ رفع اليد</button>
    <span id="status" style="color:#ff0">اكتب كود الغرفة</span>
</div>

<div id="users"><b>المتصلين</b><div id="userList"></div></div>

<div id="main">
    <div id="videoArea"><video id="canvas" controls></video></div>
    <div id="chat">
        <div id="messages"></div>
        <div id="chatInput">
            <input type="text" id="msgText" placeholder="اكتب...">
            <button id="sendMsg">ارسال</button>
        </div>
    </div>
</div>

<div id="controls">
    <button id="play">▶️ تشغيل</button>
    <button id="pause">⏸️ ايقاف</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
let video = document.getElementById('canvas');
let peer;
let connections = {};
let myName = "user" + Math.floor(Math.random()*1000);
let currentAdmin = null; // null = مافي ادمن. الكل يتحكم
let isSyncing = false;
let hostId = "";
let handRaised = {}; // مين رافع يدو
let adminTimer = null;

// === 1. تحديث الازرار + قائمة المستخدمين ===
function updateUI(){
    let list = document.getElementById('userList');
    list.innerHTML = "";
    for(let id in connections){
        let div = document.createElement('div');
        div.className = 'user-item';
        let name = id;
        let buttons = "";
        // زر الطرد للمستضيف او الادمن
        if(myName == hostId || currentAdmin == myName){
            if(id!= myName) buttons += <button class="kick-btn" onclick="kickUser('${id}')">طرد</button> ;
        }
        // زر اعطاء تحكم 30 ثانية
        if(myName == hostId || currentAdmin == myName){
            if(handRaised[id]) buttons += <button class="raise-btn" onclick="giveControl('${id}')">اعطاء تحكم</button>;
        }
        let adminIcon = id==currentAdmin?'👑': handRaised[id]?'✋':'';
        div.innerHTML = <span>${name} ${adminIcon}</span> ${buttons};
        list.appendChild(div);
    }
}

// === 2. طرد زول ===
function kickUser(id){
    if(connections[id]){
        broadcast({type: 'kick', target: id});
        connections[id].close();
        delete connections[id];
        addMsg("النظام", id + " تم طردو");
        updateUI();
    }
}

// === 3. اعطاء تحكم 30 ثانية ===
function giveControl(id){
    broadcast({type: 'tempAdmin', target: id, duration: 30000});
    addMsg("النظام", id + " اخذ التحكم لمدة 30 ثانية");
}

// === 4. رفع اليد ===
document.getElementById('raiseHand').onclick = function(){
    handRaised[myName] =!handRaised[myName];
    broadcast({type: 'raiseHand', name: myName, state: handRaised[myName]});
    updateUI();
}

// === 5. رفع الفيديو ===
document.getElementById('upload').onchange = function(e){
    let file = e.target.files[0];
    if(file){
        video.src = URL.createObjectURL(file);
        video.load();
        addMsg("النظام", "تم رفع: " + file.name);
        let reader = new FileReader();
        reader.onload = function(evt){
            broadcast({type: 'video', name: file.name, data: evt.target.result});
        }
        reader.readAsDataURL(file);
    }
}

// === 6. الدردشة ===
function addMsg(name, text){
    let div = document.createElement('div');
    div.className = 'msg';
    if(name == currentAdmin) div.innerHTML = <b class='admin'>👑 ${name}:</b> ${text};
    else div.innerHTML = <b>${name}:</b> ${text};
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop = 99999;
}

document.getElementById('sendMsg').onclick = function(){
    let text = document.getElementById('msgText').value;
    if(text!= ""){
        addMsg(myName, text);
        broadcast({type: 'chat', name: myName, text: text});
        document.getElementById('msgText').value = '';
    }
}

// === 7. زر كن الادمن الدائم ===
document.getElementById('beAdmin').onclick = function(){
    broadcast({type: 'requestAdmin', name: myName});
}

// === 8. الاتصال ===
document.getElementById('join').onclick = function(){
    let room = document.getElementById('roomId').value;
    myName = room + "-" + Math.floor(Math.random()*1000);

    peer = new Peer(myName);

    peer.on('open', function(id){
        document.getElementById('status').innerText = "اسمك: " + id;
        let hostConn = peer.connect(room);
        hostConn.on('open', function(){
            addConnection(hostConn);
            hostId = room; // اول زول هو المستضيف
        });
    });

    peer.on('connection', function(c){
        addConnection(c);
    });
}

function addConnection(c){
    connections[c.peer] = c;
    updateUI();

    c.on('data', function(data){
        if(data.type == 'kick' && data.target == myName){
            alert("تم طردك من الغرفة");
            peer.destroy();
            window.location.reload();
        }
        if(data.type == 'requestAdmin'){
            currentAdmin = data.name;
            updateUI();
            broadcast({type: 'newAdmin', name: data.name});
            addMsg("النظام", data.name + " اصبح الادمن الدائم 👑");
        }
        if(data.type == 'newAdmin'){
            currentAdmin = data.name;
            updateUI();
        }
        if(data.type == 'tempAdmin' && data.target == myName){
            currentAdmin = myName;
            updateUI();
            addMsg("النظام", "اخذت التحكم لمدة 30 ثانية");
            clearTimeout(adminTimer);
            adminTimer = setTimeout(function(){
                currentAdmin = null;
                updateUI();
                addMsg("النظام", "انتهى وقت التحكم");
            }, data.duration);
        }
        if(data.type == 'raiseHand'){
            handRaised[data.name] = data.state;
            updateUI();
            if(data.state) addMsg("النظام", data.name + " رفع يدو ✋");
        }

        isSyncing = true;
        if(data.type == 'play'){ video.currentTime = data.time; video.play(); }
        if(data.type == 'pause'){ video.currentTime = data.time; video.pause(); }
        if(data.type == 'seek'){ video.currentTime = data.time; }
        if(data.type == 'chat'){ addMsg(data.name, data.text); }
        if(data.type == 'video'){ video.src = data.data; video.load(); addMsg("النظام", "استلمت الفيديو: " + data.name); }
        setTimeout(function(){ isSyncing = false; }, 100);
    });

    c.on('close', function(){
        delete connections[c.peer];
        delete handRaised[c.peer];
        updateUI();
    });
}

function broadcast(data){
    if(isSyncing &&!['requestAdmin','newAdmin','tempAdmin','raiseHand','kick'].includes(data.type)) return;
    for(let id in connections){
        if(connections[id].open) connections[id].send(data);
    }
}

// === 9. المزامنة - الكل بقدر يتحكم الا لو في ادمن ===
video.onplay = function(){
    if(currentAdmin == null || currentAdmin == myName)
        broadcast({type: 'play', time: video.currentTime});
}
video.onpause = function(){
    if(currentAdmin == null || currentAdmin == myName)
        broadcast({type: 'pause', time: video.currentTime});
}
video.onseeked = function(){
    if(currentAdmin == null || currentAdmin == myName)
        broadcast({type: 'seek', time: video.currentTime});
}

document.getElementById('play').onclick = function(){ video.play(); }
document.getElementById('pause').onclick = function(){ video.pause(); }

updateUI();
</script>
</body>
</html>
